<head>

<title>税法(I) · 记忆卡</title>
<style>
:root{
  --bg:#eef2f7; --card:#ffffff; --ink:#0f172a; --sub:#64748b; --line:#e2e8f0;
  --brand:#0d9488; --brand2:#0f766e;
  --again:#ef4444; --hard:#f59e0b; --good:#10b981;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;user-select:none;}
header{padding:calc(env(safe-area-inset-top) + 10px) 16px 6px;flex:0 0 auto;}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.h1{font-size:17px;font-weight:700;letter-spacing:.2px;}
.h2{font-size:12.5px;color:var(--sub);margin-top:3px;}
#reset{border:none;background:#fff;color:var(--sub);width:34px;height:34px;border-radius:50%;
  font-size:16px;box-shadow:0 1px 3px rgba(15,23,42,.08);cursor:pointer;flex:0 0 auto;}
.bar{height:5px;background:#dbe3ee;border-radius:99px;margin-top:9px;overflow:hidden;}
#barfill{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px;transition:width .3s ease;}

.chaps{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 6px;flex:0 0 auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.chaps::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#334155;
  font-size:13px;font-weight:600;padding:7px 13px;border-radius:99px;cursor:pointer;white-space:nowrap;}
.chip.active{background:var(--brand);border-color:var(--brand);color:#fff;}

main{flex:1 1 auto;min-height:0;padding:4px 14px;display:flex;justify-content:center;}
.card{background:var(--card);border-radius:20px;box-shadow:0 6px 20px rgba(15,23,42,.07);
  padding:15px 18px 13px;width:100%;max-width:680px;height:100%;display:flex;flex-direction:column;min-height:0;}
.chap{font-size:11.5px;color:var(--sub);letter-spacing:.3px;margin-bottom:8px;}
.tag{display:inline-block;align-self:flex-start;font-size:11.5px;font-weight:600;color:var(--brand2);
  background:#e6f5f2;border:1px solid #c9eae5;padding:3px 9px;border-radius:99px;}
.title{font-size:19px;font-weight:700;margin:10px 0 9px;line-height:1.35;flex:0 0 auto;}
.body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  font-size:15.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word;color:#1e293b;padding-right:2px;}
.meta{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;color:var(--sub);
  display:flex;justify-content:space-between;gap:8px;flex:0 0 auto;}

.done{display:none;background:var(--card);border-radius:20px;box-shadow:0 6px 20px rgba(15,23,42,.07);
  padding:26px 20px;width:100%;max-width:680px;height:100%;flex-direction:column;justify-content:center;text-align:center;}
.done.show{display:flex;}
.done .big{font-size:44px;}
.done h3{margin:10px 0 6px;font-size:19px;}
.done p{color:var(--sub);font-size:13.5px;line-height:1.8;margin:4px 0;}
.done .sched{margin-top:14px;text-align:left;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;color:#334155;line-height:1.9;}

.nav{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 16px 6px;}
.nav button{border:1px solid var(--line);background:#fff;color:#334155;font-size:14px;font-weight:600;
  padding:9px 14px;border-radius:12px;cursor:pointer;}
.nav button:disabled{opacity:.35;}
.nav #counter{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;}

footer{flex:0 0 auto;padding:6px 14px calc(env(safe-area-inset-bottom) + 12px);
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.btn{border:none;border-radius:14px;padding:16px 6px;font-size:16px;font-weight:700;color:#fff;
  cursor:pointer;transition:transform .08s ease,filter .15s ease;}
.btn:active{transform:scale(.96);filter:brightness(.95);}
.btn.again{background:var(--again);} .btn.hard{background:var(--hard);} .btn.good{background:var(--good);}
.hint{flex:0 0 auto;text-align:center;font-size:11.5px;color:var(--sub);padding:2px 14px 0;}
</style>

<script>
const CARDS = [{"id": "ch1-01", "chapter": "第一章 税法基本原理", "tag": "第一节 · 考点01 · 税法的概念与特点 · 识", "title": "税收的概念与特征", "body": "· 征税的主体：国家，除了国家之外，任何机构和团体，都无权征税\n· 国家征税的依据：政治权力\n· 征税的基本目的：满足政府为实现国家职能的支出需要\n· 税收分配的客体：社会剩余产品\n· 税收的特征：强制性、无偿性、固定性"}, {"id": "ch1-02", "chapter": "第一章 税法基本原理", "tag": "第一节 · 考点01 · 税法的概念与特点 · 识", "title": "税法的概念与特点", "body": "· 税法是指有权的国家机关制定的有关调整税收分配过程中形成的权利义务关系的法律规范总和。\n· 从立法过程来看：属于制定法，不属于习惯法。\n· 从法律性质来看：属于义务性法规，不属于授权法。\n· 从内容来看：具有综合性，不是单一的法律。\n· 关于义务性法规：\n· 1.税法直接要求人们从事或不从事某种行为，具有强制性。\n· 2.从税法的角度看，纳税人以尽义务为主，其履行纳税义务与获得的权利不对等。\n· 3.税法属于义务性法规并不是指税法没有规定纳税人的权利，而是说纳税人的权利是建立在其纳税义务的基础之上，并且权利从总体上看不是纳税人的实体权利，而是纳税人的程序性权利（如申请复议、诉讼）。"}, {"id": "ch1-03", "chapter": "第一章 税法基本原理", "tag": "第一节 · 考点02 · 税法的原则 · 熟", "title": "税法基本原则（法公信实）", "body": "· 税法原则包括基本原则与适用原则。基本原则有四项：税收法律主义、税收公平主义、税收合作信赖主义、实质课税原则。\n· 【税收法律主义】\n· 定义：税法主体的权利义务必须由法律加以规定，税法的各类构成要素皆必须且只能由法律予以明确规定，征纳主体的权力（利）义务只以法律规定为依据，没有法律依据，任何主体不得征税或减免税收。\n· 具体原则：（1）课税要素法定：课税要素必须由法律直接规定；（2）课税要素明确：有关课税要素的规定必须尽量地明确而不出现歧义、矛盾，在基本内容上不出现漏洞；（3）依法稽征：税务行政机关必须严格依据法律的规定稽核征收，而无权变动法定课税要素和法定征收程序。\n· 【税收公平主义】\n· （1）税收负担必须根据纳税人的负担能力分配，负担能力相等，税负相同；负担能力不等，税负不同。（2）强调“禁止不平等对待”，禁止对特定纳税人给予歧视性对待，也禁止在没有正当理由的情况下对特定纳税人给予特别优惠。（3）法律上的税收公平与经济上要求的税收公平较为接近但有明显不同。\n· 【税收合作信赖主义（也称“公众信任原则”）】\n· （1）征纳双方关系就其主流来看为相互信赖合作，不是对抗性的；纳税人角度：纳税人应按照税务机关的决定及时缴纳税款；税务机关角度：没有充足的依据，税务机关不能对纳税人是否依法纳税有所怀疑。（2）税收合作信赖主义与税收法律主义存在一定的冲突，因此，许多国家税法在适用这一原则时都作了一定的限制。\n· 【实质课税原则】\n· （1）应根据纳税人的真实负担能力决定其税负，不能仅考核其表面是否符合课税要件。（2）意义在于防止纳税人避税与偷税，增强税法适用的公正性。"}, {"id": "ch1-04", "chapter": "第一章 税法基本原理", "tag": "第一节 · 考点02 · 税法的原则 · 熟", "title": "税法适用原则（4优于，2溯及）", "body": "· 税法适用原则共有六项：法律优位原则、法律不溯及既往原则、新法优于旧法原则、特别法优于普通法原则、实体从旧程序从新原则、程序优于实体原则。\n· 法律优位原则：（1）税收法律的效力高于税收行政法规的效力，税收行政法规的效力高于税务行政规章的效力（效力：法律＞法规＞规章）；（2）上位法优于下位法：效力低的税法与效力高的税法发生冲突，效力低的税法是无效的。示例：某税务规章与《税收征管法》（法律）冲突，以《税收征管法》为准。\n· 法律不溯及既往原则：新法实施后，新法实施之前人们的行为不适用新法，而只沿用旧法。示例：“营改增”后，纳税人发现其2016年5月1日之前的应税行为未申报纳税，则计算补缴税款时仍沿用营业税的规定，而不适用增值税的规定。\n· 新法优于旧法原则：同一机关制定的法律、行政法规、地方性法规、自治条例和单行条例、规章，新的规定与旧的规定不一致的，适用新的规定。示例：从2019年4月1日起，我国增值税基本税率由之前的16%调整为13%，假设某批发企业销售基本税率货物取得不含增值税销售额100万元，则计税时适用13%税率，不适用16%税率。\n· 特别法优于普通法原则：同一机关制定的法律、行政法规、地方性法规、自治条例和单行条例、规章，特别规定与一般规定不一致的，适用特别规定。示例：某税种单行条例（特别法）与《税收征管法》（普通法）冲突，优先适用单行条例。\n· 实体从旧，程序从新原则：（1）实体法不具备溯及力。在纳税义务的确定上，以纳税义务发生时的税法规定为准，实体性的税法规则不具有向前的溯及力；（2）程序法在特定条件下具备一定溯及力。程序性问题（如税款征收方法、税务行政处罚等）新税法具有约束力。示例：2022年7月1日《印花税法》施行，取消“权利、许可证照”税目，2022年6月取得的仍需缴税，体现实体从旧原则。\n· 程序优于实体原则：在税收争讼发生时，程序优于实体，以保证国家课税权的实现。纳税人通过行政复议或行政诉讼寻求法律保护的前提条件之一，是必须事先履行税务行政执法机关认定的纳税义务。示例：为了保障税款及时足额入库，纳税人对应纳税款有争议的，应先完税或提供纳税担保再申请复议或诉讼。"}, {"id": "ch1-05", "chapter": "第一章 税法基本原理", "tag": "第一节 · 考点03 · 税法的效力与解释 · 熟", "title": "税法的效力", "body": "· 税法的效力是指税法在什么地方、什么时间、对什么人具有法律约束力。其基本分类包括空间效力、时间效力、对人的效力。\n· 税法的空间效力：（1）在全国范围内有效；（2）在地方范围内有效。\n· 税法的时间效力：是指税法何时开始生效、何时终止效力和有无溯及力的问题（生效＋失效＋溯及力）。\n· 税法的生效：（1）税法通过一段时间后开始生效；（2）税法自通过发布之日起生效——重要税法个别条款的修订和小税种的设置，大多采用这种生效方式（最常见）；（3）税法公布后授权地方政府自行确定实施日期。\n· 税法的失效：（1）以新税法代替旧税法（最常见）；（2）直接宣布某项税法失效；（3）税法本身规定失效的日期（最少见）。\n· 税法的溯及力：（1）对法律溯及力的规定，概括起来包括有从旧、从新、从旧兼从轻、从新兼从轻四类基本原则；（2）实体法多从旧，程序法多从新；（3）坚持“有利溯及”原则，即在对纳税人有利的环境下，坚持税法适用上的“从轻原则”。\n· 税法对人的效力：（1）属人主义原则；（2）属地主义原则；（3）属人、属地相结合的原则（我国采用此原则）。"}, {"id": "ch1-06", "chapter": "第一章 税法基本原理", "tag": "第一节 · 考点03 · 税法的效力与解释 · 熟", "title": "税法的（法定）解释", "body": "· 税法法定解释的特点：\n· 专属性：法定解释应严格按照法定的解释权限进行，任何有权机关都不能超越权限进行解释。\n· 权威性：只要法定解释符合法的精神及法定的权限和程序，这种解释就具有与被解释的法律、法规、规章相同的效力。\n· 针对性、普遍性和一般性：法定解释大多是在法律实施过程中，特别是在法律的适用过程中进行的，是对具体的法律条文、具体的事件或案件作出的，有针对性，但其效力不限于具体的法律事件或事实，而具有普遍性和一般性。\n· 按解释权限划分（正式解释）：\n· 立法解释：税收立法机关对所设立税法的解释。解释主体为三部门：全国人大常委会（税收法律）、国务院（税收行政法规、税收暂行条例、税法实施条例等）、地方人大及其常委会（地方税收法规）。通常是指事后解释；可作判案依据。\n· 司法解释：最高司法机关对如何具体办理税务刑事案件和税务行政诉讼案件所作的具体解释或正式规定。解释主体为两高：最高人民法院、最高人民检察院。具有法的效力——可作办案与适用法律和法规的依据；在我国，税收司法解释仅限于税收犯罪范围。\n· 行政解释：国家税务机关在执法过程中对税收法律、法规等如何具体应用所作的解释。解释主体为国家税务行政主管机关（包括财政部、国家税务总局、海关总署）。原则上不作判案直接依据；在执法中有普遍约束力。\n· 按解释尺度分类：\n· 字面解释：必须严格依税法条文的字面含义进行解释，既不扩大也不缩小（是税法解释的基本方法）。\n· 限制解释：对税法条文所进行的窄于其字面含义的解释。\n· 扩充解释：对税法条文所进行的大于其字面含义的解释。尽管在税法中存在，但一般不将其作为一项解释方法去使用。"}, {"id": "ch1-07", "chapter": "第一章 税法基本原理", "tag": "第一节 · 考点04 · 税法与其他部门法的关系 · 识", "title": "税法与其他部门法的关系", "body": "· 税法与宪法：联系——税法依据宪法制定；区别——税法属于部门法，其位阶低于宪法。\n· 税法与民法：联系——民法作为最基本的法律形式之一，税法大量借用了民法的概念、规则和原则；区别——（1）调整对象不同：民法调整的是平等主体财产关系和人身关系（横向），税法调整的是国家和纳税人之间的税收征纳关系（纵向）；（2）法律关系建立及调整适用原则不同：民事法律关系建立及调整按照自愿、公平、等价有偿、诚实信用的原则进行，双方地位平等，意思表示自由，民法原则总体上不适用于税收法律关系的建立和调整，税收法律关系体现国家单方面的意志，权利义务关系不对等，这些特点是与民法完全对立的；（3）调整程序不同：民事纠纷应按民事诉讼程序解决，而税务纠纷一般先由上一级税务机关复议；（4）调整手段不同：民法以民事手段作为调整手段，违法者承担的主要法律责任是民事责任，税法的调整手段则具有综合性，不仅包括民事性质的责任追究，更多的是行政处罚和刑罚手段，违法者承担的法律责任主要是行政责任与刑事责任。处理民事纠纷适用调解原则，而解决税收法律关系中的争议不适用此原则；不过作为例外，涉及税务行政赔偿的，可以适用调解原则。\n· 税法与行政法：联系——税法具有行政法的一般特征；区别——（1）调整国家机关之间、国家机关与法人或自然人之间的法律关系；（2）法律关系中居于领导地位的一方总是国家；（3）体现国家单方面意志，不需要双方意思表示一致；（4）解决法律关系中的争议，一般都按照行政复议程序和行政诉讼程序进行。行政法大多为授权性法规，而税法则是一种义务性法规。\n· 税法与刑法：联系——（1）在调整对象上有衔接和交叉：如刑法有“危害税收征管罪”；（2）对税收犯罪的刑罚，在体系和内容上可认为是构成税法的一部分，但解释和执行上主要依据刑法的有关规定；（3）税收犯罪和刑事犯罪司法调查程序一致；（4）都具备明显的强制性，刑法是实现税法强制性最有力的保证。区别——（1）调整对象不同：刑法是通过规定什么行为是犯罪和对罪犯的惩罚来实现打击犯罪的目的，而税法是调整税收权利义务关系的法律规范；（2）法律性质不同：税法属于义务性法规，刑法属于禁止性法规；（3）法律责任的承担形式不同：税收法律责任的追究形式是多重的，而对刑事法律责任的追究只能采用自由刑与财产刑的刑罚形式。\n· 税法与经济法：税法具有较强的经济属性；经济法中的许多法律是制定税法的重要依据；经济法中的一些概念、规则、原则也在税法中大量应用；经济法调整的是经济管理关系，而税法的调整对象则含有较多的税务行政管理的性质。\n· 税法与国际法：两者是相互影响、相互补充、相互配合的。"}, {"id": "ch1-08", "chapter": "第一章 税法基本原理", "tag": "第二节 · 考点01-02 · 税收法律关系的概念、特点与构成 · 识", "title": "税收法律关系的概念、特点与基本构成", "body": "· 概念：税收法律关系是税法所确认和调整的，国家与纳税人之间在税收分配过程中形成的权利义务关系。\n· 具体类型：国家与纳税人之间的税收宪法性法律关系；征税机关与纳税主体之间的税收征纳关系；相关国家机关之间的税收权限划分法律关系；国际税收权益分配法律关系；税收救济法律关系等。\n· 特点：\n· 1.主体的一方只能是国家。构成税收法律关系主体的一方可以是任何负有纳税义务的法人和自然人，但是另一方只能是国家。\n· 2.体现国家单方面的意志。税收法律关系的成立、变更、消灭不以主体双方意思表示一致为要件。\n· 3.权利义务关系具有不对等性。在税收法律关系中，国家享有较多的权利；纳税人承担较多的义务。\n· 4.具有财产所有权或支配权单向转移的性质。\n· 基本构成：\n· 主体——征税主体：国家是真正的征税主体，税务机关通过获得授权成为法律意义上的征税主体；纳税主体：负有纳税义务的单位和个人，即“纳税人”，按纳税主体在民法中身份的不同，分为自然人、法人、非法人单位，按征税权行使范围的不同，分为居民纳税人、非居民纳税人。\n· 内容：税收法律关系主体所享受的权利和所承担的义务，主要包括纳税人的权利义务和征税机关的权利义务。\n· 客体：税收法律关系主体的权利义务所指向的对象，一般认为，税收法律关系的客体就是税收利益，包括物和行为两大类。"}, {"id": "ch1-09", "chapter": "第一章 税法基本原理", "tag": "第二节 · 考点03 · 税收法律关系的产生、变更、消灭 · 熟", "title": "税收法律关系的产生、变更、消灭", "body": "· 产生：以引起纳税义务成立的法律事实为基础和标志（出现应税行为）。举例：企业销售货物、个人取得工资薪金所得、不动产转让等。\n· 变更原因：（1）由于纳税人自身的组织状况发生变化；（2）由于纳税人的经营或财产情况发生变化；（3）由于税务机关组织结构或管理方式发生变化；（4）由于税法的修订或调整；（5）因不可抗力造成破坏损失。举例：企业因合并变更纳税人身份、增值税税率从16%调整为13%、地震导致经营中断等。\n· 消灭原因：（1）纳税人履行纳税义务；（2）纳税义务因超过期限而消灭；（3）纳税义务的免除；（4）某些税法的废止；（5）纳税主体的消失。举例：纳税人缴清年度税款、企业依法注销、某地方税种被废止。"}, {"id": "ch1-10", "chapter": "第一章 税法基本原理", "tag": "第三节 · 考点01 · 税收实体法（纳税义务人） · 熟", "title": "税收实体法概述与纳税义务人", "body": "· 税收实体法：\n· 含义：规定税收法律关系主体的实体权利、义务的法律规范总称，是税法的核心部分。\n· 特点：税种与实体法一一对应（一税一法）；税收要素固定性。\n· 要素：纳税义务人，课税对象，税率，减税、免税，税收附加与加成，纳税环节，纳税期限（7大要素）。\n· 纳税义务人（简称纳税人，也称纳税主体）：税法规定的直接负有纳税义务的单位和个人，一般分为法人和自然人。\n· 相关概念：\n· 负税人：实际负担税款的单位和个人。现实中，纳税人与负税人有时一致（直接税），有时不一致（间接税）。纳税人与负税人不一致主要是由于价格与价值背离，引起税负转移或转嫁造成的。货物劳务税的纳税人和负税人通常是不一致的；所得税的纳税人和负税人通常是一致的。\n· 代扣代缴义务人：是指税收法律、行政法规已经明确规定负有扣缴义务的单位和个人在支付款项时，代税务机关从支付给负有纳税义务的单位和个人的收入中扣留并向税务机关解缴的行为。\n· 代收代缴义务人：是指税收法律、行政法规已经明确规定负有扣缴义务的单位和个人在收取款项时，代税务机关向负有纳税义务的单位和个人收取并向税务机关缴纳的行为。\n· 受托代征人：是指根据税务机关的委托，依照法律规定代征零星、分散和异地缴纳税收的单位和人员。\n· 纳税单位：是指申报缴纳税款的单位，是纳税人的有效集合。\n· 代扣代缴与代收代缴的区别：代扣代缴义务人直接持有纳税人的收入，可从中扣除纳税人的应纳税款；代收代缴义务人不直接持有纳税人的收入，只能在与纳税人的经济往来中收取纳税人的应纳税款并代为缴纳。"}, {"id": "ch1-11", "chapter": "第一章 税法基本原理", "tag": "第三节 · 考点01 · 税收实体法（课税对象） · 熟", "title": "课税对象", "body": "· 含义：税法中规定的征税的目的物，是国家据以征税的依据，解决对什么征税。\n· 重要作用：（1）是区别一种税与另一种税的最主要标志；（2）体现着各种税的征税范围；（3）其他要素的内容一般都是以课税对象为基础确定的。\n· 计税依据（税基）：税法规定的据以计算各种应征税款的依据或标准。课税对象是从质的方面对征税所作的规定，而计税依据则是从量的方面对征税所作的规定，是课税对象量的表现。\n· 两者关系：一致时，计税依据表现为价值形态，如所得税（课税对象和计税依据：所得额）；不一致时，表现为实物形态，如车船税（课税对象：车辆、船舶；计税依据：辆数、整备质量吨位数、艇身长度米数、净吨位数）。\n· 税源：税款的最终来源，税收负担的最终归宿，其大小表明纳税人的负担能力。\n· 两者关系：一致时，如所得税（课税对象为国民收入分配中形成的各种收入）；不一致时，如房产税。\n· 税目：是课税对象的具体化，反映具体的征税范围，代表征税的广度。\n· 作用：①进一步明确征税范围；②解决课税对象的归类（税目税率同步考虑——税目税率表，如消费税、资源税）。\n· 分类：①列举税目：如消费税中“小汽车”；②概括税目：如消费税中“其他贵重首饰和珠宝玉石”。"}, {"id": "ch1-12", "chapter": "第一章 税法基本原理", "tag": "第三节 · 考点01 · 税收实体法（税率） · 熟", "title": "税率", "body": "· 税率是计算税额的尺度，代表课税的深度，关系着国家的收入多少和纳税人的负担程度，是税收制度的核心和灵魂。\n· 税率的形式：比例税率、累进税率、定额税率、其他有关税率。\n· 各税率形式的含义：\n· 比例税率：是指同一征税对象或同一税目，不论数额大小只规定一个比例，都按同一比例征税。税额与课税对象呈正比例关系。\n· 累进税率：是指同一课税对象，随着数量的增大，征收比例也随之增高的税率，表现为将课税对象按数额大小划分等级，不同等级规定不同税率。\n· 定额税率：又称固定税额，是根据课税对象的计量单位（如数量、重量、面积、体积等），直接规定固定的征税数额。\n· 累进税率的形式及适用范围：\n· 全额累进税率（累进依据是绝对数）：我国目前无。\n· 超额累进税率（累进依据是绝对数）：个人所得税（居民个人综合所得、经营所得）。\n· 全率累进税率（累进依据是相对数）：我国目前无。\n· 超率累进税率（累进依据是相对数）：土地增值税。\n· 以居民个人综合所得个人所得税为例：全额累进税率（直接计算）——应纳税所得额35999元，应纳税额＝35999×3%＝1079.97元；36001元，应纳税额＝36001×10%＝3600.1元。超额累进税率（分段计算）——35999元，应纳税额＝35999×3%＝1079.97元；36001元，应纳税额＝36000×3%＋1×10%＝1080.1元。\n· 结论：①全额累进税率，计算简单，但存在不合理现象——在级距临界点附近，容易出现税额增加超过课税对象数额增加的不合理现象；②超额累进税率，避免税额增加超过课税对象数额增加的不合理现象，但计算较复杂——为简化计算，引入速算扣除数。\n· 我国税种目前的税率形式：\n· 比例税率：①产品比例税率——高档化妆品、小汽车消费税税率；②行业比例税率——建筑服务业、金融行业增值税税率；③地区差别比例税率——城市维护建设税；④有幅度的比例税率——契税。\n· 超额累进税率：个人所得税——居民个人综合所得、经营所得。\n· 超率累进税率：土地增值税。\n· 定额税率：①地区差别定额税率——城镇土地使用税、耕地占用税；②分类分项定额税率——车船税。\n· 其他有关税率：\n· 名义税率：税法规定的税率。\n· 实际税率：实际负担率＝实际缴纳税额÷计税依据实际数额。由于某些税种中计税依据与征税对象不一致、减免税政策的享受等因素的实际存在，实际税率常常低于名义税率。\n· 边际税率：边际税率＝△税额÷△收入。在比例税率条件下，边际税率等于平均税率；在累进税率条件下，边际税率往往大于平均税率。\n· 平均税率：平均税率＝∑税额÷∑收入。\n· 零税率：以零表示的税率，表明课税对象的持有人负有纳税义务，但不需缴纳税款。\n· 负税率：政府利用税收形式对所得额低于某一特定标准的家庭或个人予以补贴的比例，主要用于负所得税的计算。"}, {"id": "ch1-13", "chapter": "第一章 税法基本原理", "tag": "第三节 · 考点01 · 税收实体法（减免税等要素） · 熟", "title": "减税免税、税收附加与加成、纳税环节、纳税期限", "body": "· 减税、免税：\n· 1.减税、免税是对某些纳税人或课税对象的鼓励或照顾措施。减税是从应征税款中减征部分税款；免税是免征全部税款。\n· 2.根据《税收征管法》的规定，减税、免税依照法律的规定执行，法律授权国务院的，依照国务院制定的行政法规的规定执行。\n· 3.减免税的基本形式：①税基式减免——通过直接缩小计税依据的方式实现减税、免税，使用范围最广泛，具体表现：起征点、免征额、项目扣除、跨期结转；②税率式减免——通过直接降低税率的方式实行的减税、免税，具体表现：重新确定税率、选用其他税率；③税额式减免——通过直接减少应纳税额的方式实行的减税、免税，使用范围最窄，具体表现：全部免征、减半征收、核定减免率、抵免税额、另定减征税额。\n· 起征点与免征额：起征点是征税对象达到一定数额开始征税的起点；免征额是在征税对象的全部数额中免予征税的数额。相同点：未达到均不征税。不同点：起征点是超了全额征税；免征额是超了超额征税。\n· 税收附加与加成：\n· 税收附加：也称“地方附加”，计算方法是以正税税款为依据，按规定的附加率计算附加额，即附加税额＝正税税额×附加率。正税是指国家正式开征并纳入预算内收入的各种税收。\n· 税收加成：是根据规定税率计税后，再以应纳税额为依据加征一定成数的税额，一成相当于加征应纳税额的10%，十成相当于加征应纳税额的100%，即应纳税额＝计税依据×税率×（1＋加成成数）。\n· 纳税环节：\n· 是指税法规定的课税对象从生产到消费的流转过程中应当缴纳税款的环节。\n· 广义的纳税环节指全部课税对象在再生产中的分布情况，如资源税分布在生产环节，商品税分布在流通环节，所得税分布在分配环节；狭义的纳税环节是商品课税中的特殊概念。\n· 按照纳税环节的多少：①一次课征制——指同一税种在商品流转的全过程中只选择某一环节课征的制度，如消费税中的高档化妆品、车辆购置税等；②多次课征制——指同一税种在商品流转全过程中选择两个或两个以上环节课征的制度，如增值税（生产、批发、零售环节）、消费税中的卷烟（生产＋批发环节）。\n· 纳税期限：\n· 是指纳税人按照税法规定缴纳税款的期限。\n· 决定因素：税种的性质；应纳税额的大小。\n· 三种形式：①按期纳税，如增值税；②按次纳税，如车辆购置税、耕地占用税；③按年计征，分期预缴或缴纳，如企业所得税按年计征、分期预缴，房产税、城镇土地使用税按年计算、分期缴纳。"}, {"id": "ch1-14", "chapter": "第一章 税法基本原理", "tag": "第三节 · 考点02 · 税收程序法 · 识", "title": "税收程序法", "body": "· 税收程序法的作用：（1）保障实体法的实施，弥补实体法的不足；（2）规范和控制行政权的行使；（3）保障纳税人合法权益；（4）提高执法效率。\n· 税收程序法的主要制度：（1）表明身份制度；（2）回避制度；（3）职能分离制度；（4）听证制度；（5）时限制度。\n· 行政机关拟作出下列行政处罚决定，应当告知当事人有要求听证的权利，当事人要求听证的，行政机关应当组织听证：\n· （1）较大数额罚款。税务机关对公民作出2000元以上（含本数）罚款或者对法人或者其他组织作出1万元以上（含本数）罚款的行政处罚之前，应当向当事人送达《税务行政处罚事项告知书》，告知当事人已经查明的违法事实、证据、行政处罚的法律依据和拟将给予的行政处罚，并告知有要求举行听证的权利。\n· （2）没收较大数额违法所得、没收较大价值非法财物。\n· （3）降低资质等级、吊销许可证件。\n· （4）责令停产停业、责令关闭、限制从业。\n· （5）其他较重的行政处罚。\n· （6）法律、法规、规章规定的其他情形。"}, {"id": "ch1-15", "chapter": "第一章 税法基本原理", "tag": "第四节 · 考点01 · 税收立法 · 精", "title": "税收立法的概念、要点、形式与税收法律", "body": "· 概念：广义——国家机关根据法定权限和程序，制定、修改、废止税收法律规范的活动；狭义——全国人大及其常委会制定税收法律规范的活动。\n· 要点：\n· （1）从税收立法的主体来看，国家机关包括全国人大及其常委会、国务院及其有关职能部门、拥有地方立法权的地方权力机关等。\n· （2）税收立法权的划分，是税收立法的核心问题。①划分税收立法权的直接法律依据主要是《宪法》与《立法法》；②税种的设立、税率的确定和税收征收管理等税收基本制度应当由全国人大及其常委会制定法律。\n· （3）税收立法必须经过法定程序。\n· （4）制定税法是税收立法的重要部分，但不是其全部，修改、废止税法也是其必要的组成部分。\n· 税收立法的形式（法的形式—制定机关—税法的形式）：宪法—全国人大；法律—全国人大及其常委会—税收法律；行政法规—国务院—税收法规；地方性法规—地方人大及其常委会；部门规章—国务院税务主管部门—税务部门规章；地方政府规章—地方人民政府。\n· 税收法律（全国人大及其常委会制定，最高权力机关）：\n· 创制程序（4项）：提出→审议→表决通过→公布（国家主席签署主席令公布）。\n· 在我国现行税法体系中，以税收法律形式颁布的税种：企业所得税、个人所得税、增值税、城市维护建设税、烟叶税、船舶吨税、环境保护税、资源税、耕地占用税、契税、印花税、车船税、车辆购置税、关税。\n· 尚未以税收法律形式颁布的税种：消费税、土地增值税、房产税、城镇土地使用税（消费一房二土）。"}, {"id": "ch1-16", "chapter": "第一章 税法基本原理", "tag": "第四节 · 考点01 · 税收立法 · 精", "title": "税收法规、税务部门规章与税务规范性文件", "body": "· 税收法规（国务院，最高国家行政机关）：\n· （1）创制程序（4项）：立项→起草→审查→决定和公布（国务院总理签署国务院令公布实施）。\n· （2）税收行政法规应在公布后30日内报全国人大常委会备案。\n· （3）目前，在我国税法体系中，税收法律的实施细则或实施条例，都是以税收行政法规的形式出现的。\n· （4）税收行政法规的效力低于宪法、税收法律，而高于税务部门规章。\n· 税务部门规章：\n· 权限范围：（1）国家税务总局根据法律和国务院的行政法规、决定、命令，在权限范围内制定对税务机关和税务行政相对人具有普遍约束力的税务部门规章。不能另行创设法律和国务院的行政法规、决定、命令没有规定的内容；原则上也不得重复法律和国务院的行政法规、决定、命令已经明确规定的内容（不立异、不重复）；（2）税务部门规章不得溯及既往，但是为了更好地保护税务行政相对人权益而作出的特别规定除外（不追溯）。\n· 制定程序：（1）立项、起草、审查、决定、公布、解释、修改和废止；（2）税务部门规章以国家税务总局令公布。\n· 施行时间：税务部门规章一般应当自公布之日起30日后施行。但是公布后不立即施行将有碍施行的，可自公布之日起施行。\n· 解释：税务部门规章由国家税务总局负责解释，税务部门规章解释与税务部门规章具有同等效力。\n· 评估：国家税务总局可以根据需要，开展税务部门规章立法后评估。\n· 清理：国家税务总局应及时开展税务部门规章清理工作，对不适应全面深化改革和经济社会发展要求、不符合上位法规定的税务部门规章，应当及时修改或者废止。\n· 税务规范性文件：\n· 概念：是指县以上税务机关依照法定职权和规定程序制定并发布的，影响纳税人、缴费人、扣缴义务人等税务行政相对人权利、义务，在本辖区内具有普遍约束力并在一定期限内反复适用的文件。\n· 特征：①属于行为规则；②适用主体的非特定性；③不具有可诉性；④是法律行为的延伸。\n· 权限范围：①税务规范性文件不得设定税收开征、停征、减税、免税、退税、补税事项，不得设定行政许可、行政处罚、行政强制、行政事业性收费等事项；②各级税务机关的内设机构、派出机构、临时性机构，不得以自己的名义制定税务规范性文件。\n· 制定规则：①名称：可以使用“办法”“规定”“规程”“规则”等名称，但是不得称“条例”“实施细则”“通知”“批复”等；②要素：应根据需要，明确制定目的和依据、适用范围和主体、权利义务、具体规范、操作程序、施行日期或者有效期限等事项；③表述方式：可以采用条文式或者段落式表述；④授权：上级税务机关可以授权下级税务机关制定具体的实施办法；⑤解释权限：制定机关负责解释，不得将税务规范性文件的解释权授予本级机关的内设机构或者下级税务机关；⑥执行时间：自发布之日起30日后施行，不立即施行将有碍执行的，可以自发布之日起施行。\n· 文件审查：各级纳税服务部门、政策法规部门负责对税务规范性文件进行审查，包括权益性审核、合法性审核、世界贸易组织规则合规性评估。\n· 发布：税务规范性文件应当以公告形式发布；未以公告形式发布的，不得作为税务机关执法依据。"}, {"id": "ch1-17", "chapter": "第一章 税法基本原理", "tag": "第四节 · 考点02-03 · 税收执法与税收司法 · 熟", "title": "税收执法与税收司法", "body": "· 税收执法（狭义专指国家税收机关依法定的职权和程序将税法的一般法律规范适用于税务行政相对人或事件，调整具体税收关系的实施税法的活动）：\n· 税收执法的特征：（1）具有单方意志性和法律强制力（无须纳税人同意）；（2）是具体行政行为（针对特定对象）；（3）具有裁量性（如处罚幅度、核定税额）；（4）具有主动性（主动执法，无须申请）；（5）具有效力先定性（未被撤销前推定有效）；（6）是有责行政行为（执法不当需承担责任）。\n· 税收执法基本原则：合法性——（1）执法主体法定；（2）执法内容合法；（3）执法程序合法；（4）执法根据合法。合理性——主要原因是行政自由裁量权的存在（如处罚与违法情节相当）。\n· 税收执法监督：特征——（1）税收执法监督的主体是税务机关；（2）税收执法监督的对象是税务机关及其工作人员（不同于税务稽查）；（3）税收执法监督的内容是税务机关及其工作人员的行政执法行为。形式——（1）事前监督：税务规范性文件合法性审核制度是一种重要的事前监督方式；（2）事中监督：重大税务案件审理制度是事中监督的重要形式；（3）事后监督：税收执法检查、复议应诉等工作是典型的事后监督。\n· 税收司法：\n· 概述：广义的税收司法，是指各级公安机关、人民检察院和人民法院等国家司法机关，在宪法和法律规定的职权范围内，按照法定程序处理涉税行政、民事和刑事案件的专门活动。基本原则——独立性原则（司法机关独立行使职权，不受干涉）、中立性原则（公正裁决，不偏不倚）。\n· 税收行政司法：指法院等司法机关所受理的涉及税务机关的诉讼案件和非诉讼案件的执行申请等，既包括涉税行政诉讼制度，也包括税务机关或法院所采取的强制执行程序制度；保障纳税人的合法权益是应有之义，而且它可以通过对税务机关的征税行为加以审查监督，督促其依法行政；以具体税收行政行为为审查对象，排除抽象税收行政行为；对具体行政行为的审查，仅限于合法性审查。\n· 税收刑事司法：以《刑法》和《刑事诉讼法》为法律依据；程序制度：4个参与机关——税务机关、公安机关、检察院和法院，4个阶段——案件移送、立案侦查、提起公诉、司法裁判。\n· 税收民事司法——税收优先权：是指当国家征税权力与其他债权同时存在时，税款的征收原则上应优先于其他债权。（1）税务机关征收税款，税收优先于无担保债权，法律另有规定的除外；（2）纳税人欠缴的税款发生在纳税人以其财产设定抵押、质押或者纳税人的财产被留置之前的，税收应当先于抵押权、质权和留置权执行；（3）纳税人欠缴税款，同时又被行政机关处以罚款、没收违法所得的，税收优先于罚款、没收违法所得。\n· 税收代位权、撤销权：税收代位权，是指欠缴税款的纳税人因怠于行使到期债权，给国家税收造成损害时，税务机关可以向人民法院请求以自己的名义代替纳税人行使其债权的权利；税收撤销权，是指欠缴税款的纳税人放弃到期债权、无偿转让财产、以明显不合理的低价转让财产而受让人知道该情形，对国家税收造成损害，税务机关请求人民法院撤销纳税人该行为的权利；税务机关行使代位权、撤销权的，不免除欠缴税款的纳税人尚未履行的纳税义务和应承担的法律责任。"}, {"id": "ch1-18", "chapter": "第一章 税法基本原理", "tag": "第五节 · 考点01-02 · 税收制度的建立与发展 · 识", "title": "税收制度的建立与发展", "body": "· 中国历史上的税收制度：\n· 夏、商、周时期：贡、助、彻（税收雏形）。\n· 春秋战国时期：初税亩（中国税收由雏形阶段进入成熟时期）。\n· 唐朝中期：两税法。\n· 宋朝时期：商税制度、王安石变法。\n· 明朝时期：一条鞭法。\n· 清朝时期：摊丁入亩。\n· 中华人民共和国成立后税收制度的建立与发展（六阶段）：\n· 20世纪50年代至70年代——税收制度的建立与调整：首部《宪法》规定“中华人民共和国公民有依法纳税的义务”（1954年）；《文化娱乐税条例》是我国最高立法机关首次通过的税收法律（1956年）。\n· 20世纪80年代——税收法制建设的初创阶段。\n· 20世纪90年代——税收法制建设的完善阶段。\n· 21世纪初——税收法制建设的新阶段。\n· 21世纪10年代——实施以完善立法为首要任务的财税改革。\n· 21世纪20年代——进一步深化税收征管改革。"}, {"id": "ch2-01", "chapter": "第二章 增值税", "tag": "考点01 · 增值税概述 · 识", "title": "增值税的概念", "body": "增值税是以单位和个人生产经营过程中取得的增值额为课税对象征收的一种税。"}, {"id": "ch2-02", "chapter": "第二章 增值税", "tag": "考点02 · 增值税概述 · 识", "title": "增值税的类型(三种)", "body": "区分标志——增值额计算中对外购固定资产的处理方式不同。\n· 生产型增值税：不允许扣除任何外购固定资产的价款（我国自1994年1月1日至2008年12月31日执行）。\n· 收入型增值税：只允许扣除当期计入产品价值的折旧费部分。\n· 消费型增值税：允许将当期购入固定资产价款一次性全部扣除（我国自2009年1月1日起全国执行）。"}, {"id": "ch2-03", "chapter": "第二章 增值税", "tag": "考点03 · 增值税概述 · 识", "title": "增值税的性质、计税原理及计税方法", "body": "增值税的性质：\n· 以全部销售额为计税依据（另有规定除外）。\n· 税负具有转嫁性（增值税是价外税、间接税）。\n· 按产品或行业实行比例税率（广泛征收）。\n计税原理：\n· 按全部销售额计算税款，但只对其中的新增价值征税。\n· 实行税款抵扣制度，对以前环节已纳税款予以扣除。\n· 税款随销售逐环节转移，最终消费者承担全部税款。\n计税方法：\n· 直接计算法：增值税=增值额×税率。\n· 间接计算法：增值税=销项税额-进项税额。"}, {"id": "ch2-04", "chapter": "第二章 增值税", "tag": "考点01 · 纳税义务人和扣缴义务人 · 精", "title": "增值税纳税人的基本规定", "body": "(一)纳税人\n一般规定：在中华人民共和国境内(以下简称“境内”)销售货物、服务、无形资产、不动产(以下称“应税交易”)，以及进口货物的单位和个人，为增值税的纳税人。个人，包括个体工商户和自然人。\n特殊规定：\n· 单位以承包、承租、挂靠方式经营，承包人、承租人、挂靠人以发包人、出租人、被挂靠人名义对外经营并由发包人、出租人、被挂靠人承担相关法律责任的，发包人、出租人、被挂靠人为纳税人；其他情形下，承包人、承租人、挂靠人为纳税人。（“名义+责任”才纳税）\n· 资管产品运营过程中发生的增值税应税交易，以资管产品管理人为增值税纳税人。法律另有规定的，从其规定。资管产品管理人，包括银行、信托公司、公募基金管理公司及其子公司、证券公司及其子公司、期货公司及其子公司、私募基金管理人、保险资产管理公司、专业保险资产管理机构、养老保险公司。"}, {"id": "ch2-05", "chapter": "第二章 增值税", "tag": "考点01 · 纳税义务人和扣缴义务人 · 精", "title": "增值税扣缴义务人的规定", "body": "· 境外单位和个人在境内发生应税交易：以购买方为扣缴义务人（按国务院规定委托境内代理人申报缴纳的除外）。\n· 向自然人出租境内不动产：有境内代理人的，由境内代理人申报缴纳税款。\n· 自然人发生符合规定的应税交易：以支付价款的境内单位为扣缴义务人。\n· 除另有规定外，扣缴义务人应代扣代缴增值税税额=销售额×税率。"}, {"id": "ch2-06", "chapter": "第二章 增值税", "tag": "考点02 · 纳税义务人和扣缴义务人 · 精", "title": "增值税纳税人的分类及一般纳税人登记管理", "body": "年应征增值税销售额，是指纳税人在连续不超过12个月或4个季度的经营期内累计应征增值税销售额。\n(一)一般纳税人和小规模纳税人的分类\n· 一般纳税人：年应征增值税销售额＞500万元；一般情况下实行一般计税方法计算增值税，符合条件可以抵扣进项税额；应纳税额=销项税额-进项税额。\n· 小规模纳税人：年应征增值税销售额≤500万元；实行简易办法征收增值税，不得抵扣进项税额；应纳税额=不含税销售额×征收率。\n(二)一般纳税人登记管理\n一般情形：\n· 年应征增值税销售额超过规定标准（＞500万元）的，应当办理一般纳税人登记（自然人及按照政策规定选择按小规模纳税人纳税的除外）。\n· 年应征增值税销售额未超过规定标准（≤500万元）的，无须办理一般纳税人登记（作为小规模纳税人）。\n· 年应征增值税销售额未超过规定标准的纳税人，会计核算健全、能提供准确税务资料的，可以办理一般纳税人登记。\n特殊情形——不办理一般纳税人登记（作为小规模纳税人）：\n· 自然人。\n· 不经常发生应税交易且主要业务不属于应税交易范围的非企业单位，选择按照小规模纳税人纳税的。\n其他规定：\n· 经营期是指在纳税人存续期内的连续经营期间，含未取得销售收入的月份或季度。\n· 纳税人偶然发生的销售无形资产、转让不动产的销售额，不计入年应征增值税销售额的计算。\n· 纳税人因自行补充或更正、风控核查、稽查查补等调整的销售额，应按纳税义务发生时间计入对应税款所属期销售额。\n一般纳税人生效之日(常规情形)：\n· 纳税人年应征增值税销售额超过规定标准的，一般纳税人生效之日为超过规定标准的当期1日。\n· 纳税人年应征增值税销售额未超过规定标准，办理一般纳税人登记的，一般纳税人生效之日为办理登记的当期1日。\n相关手续办理：\n· 纳税人因自行补充或更正、风控核查、稽查查补等调整销售额，年应征增值税销售额超过规定标准的，应自调整之日起10个工作日内按规定办理手续。\n· 其他年应征增值税销售额超过规定标准的，应在超过规定标准的次月申报纳税期限内按规定办理手续。\n· 纳税人未按规定期限办理一般纳税人登记手续的，自规定期限结束后5个工作日起按一般纳税人管理。\n不再符合小规模纳税人纳税条件的处理：\n· 纳税人因自身条件或经营业务变化，不再符合选择按照小规模纳税人纳税的，应在变化当期向主管税务机关书面报告，自不符合规定当期起不再适用选择按照小规模纳税人纳税。\n· 主管税务机关发现纳税人不符合选择按照小规模纳税人纳税的，在发现之日起5个工作日内制作《税务事项通知书》，告知纳税人自不符合规定当期起不再适用选择按照小规模纳税人纳税。"}, {"id": "ch2-07", "chapter": "第二章 增值税", "tag": "考点01 · 征税范围 · 熟", "title": "销售货物的范围及销售服务的6项内容", "body": "销售货物（13%、9%税率）：\n· 销售，是指有偿转让所有权。\n· 货物，包括有形动产、电力、热力、气体等。\n销售服务（6项）：交通运输服务、邮政服务、电信服务、建筑服务、金融服务、生产生活服务。"}, {"id": "ch2-08", "chapter": "第二章 增值税", "tag": "考点01 · 征税范围 · 熟", "title": "交通运输服务", "body": "交通运输服务——9%税率：\n· 陆路运输服务：包括铁路、公路、缆车、索道、地铁、城市轻轨等运输。\n· 水路运输服务：水路运输的程租、期租业务，属于水路运输服务。\n· 航空运输服务：航天运输、航空运输的湿租业务，属于航空运输服务。\n· 管道运输服务：指通过管道设施输送气体、液体、固体物质的运输服务。\n与“交通运输服务”相关的其他规定：\n· 出租车公司向使用本公司自有出租车的出租车司机收取的管理费用，按照“交通运输服务——陆路运输服务”缴纳增值税。\n· 无运输工具承运业务，按照“交通运输服务”缴纳增值税。\n· 纳税人已售票但客户逾期未消费取得的运输逾期票证收入，按照“交通运输服务”缴纳增值税。\n· 货物运输代理服务属于“生产生活服务——商务辅助服务”。"}, {"id": "ch2-09", "chapter": "第二章 增值税", "tag": "考点01 · 征税范围 · 熟", "title": "邮政服务、电信服务、建筑服务、金融服务", "body": "邮政服务——9%税率：\n· 邮政普遍服务：指函件、包裹等邮件寄递，以及邮票发行、报刊发行和邮政汇兑等业务活动。\n· 邮政特殊服务：指义务兵平常信函、机要通信、盲人读物和革命烈士遗物的寄递等业务活动。\n· 其他邮政服务：指邮册等邮品销售、邮政代理等业务活动。\n电信服务——9%、6%税率：\n· 基础电信服务（9%）：指利用固网、移动网、卫星、互联网，提供语音通话服务、手机流量服务、短信和彩信服务、互联网宽带接入服务的业务活动，及出租或出售带宽、波长等网络元素的业务活动。\n· 增值电信服务（6%）：指利用固网、移动网、卫星、互联网、有线电视网络，提供电子数据和信息的传输及应用服务（不含手机流量服务）、互联网接入服务（不含宽带接入服务）、卫星电视信号落地转接服务等业务活动。\n建筑服务——9%税率：\n· 工程服务：指新建、改建各种建筑物、构筑物的工程作业。\n· 安装服务：指各种设备、设施的装配、安置工程作业；固定电话、有线电视、宽带、水、电、燃气、暖气等经营者向用户收取的安装费、初装费、开户费、扩容费以及类似收费，按照安装服务缴纳增值税。\n· 修缮服务：指对建筑物、构筑物进行修补、加固、养护、改善，使之恢复原来的使用价值或者延长其使用期限的工程作业。\n· 装饰服务：指对建筑物、构筑物进行修饰装修，使之美观或具有特定用途的工程作业。\n· 其他建筑服务：如钻井(打井)、拆除建筑物或构筑物、平整土地、园林绿化等工程作业。\n金融服务——6%税率：\n· 贷款服务：各种占用、拆借资金取得的收入，包括保本收益、报酬、资金占用费、补偿金、金融商品持有期间(含到期)利息及利息性质收入，信用卡透支利息收入，融资性售后回租、罚息、票据贴现等业务取得的利息及利息性质的收入，按照“贷款服务”缴纳增值税；以货币资金投资收取的固定利润、保底利润，按照“贷款服务”缴纳增值税。\n· 直接收费金融服务：包括提供货币兑换、信用卡、基金管理、金融交易场所(平台)管理、资金结算、资金清算等服务。\n· 保险服务：包括人身保险服务和财产保险服务。\n· 金融商品转让：指转让外汇、有价证券、非货物期货和其他金融商品所有权的业务活动；纳税人转让因同时实施股权分置改革和重大资产重组而首次公开发行股票并上市形成的限售股，以及上市首日至解禁日期间由上述股份孳生的送、转股，以该上市公司股票上市首日开盘价为买入价，按照“金融商品转让”缴纳增值税。"}, {"id": "ch2-10", "chapter": "第二章 增值税", "tag": "考点01 · 征税范围 · 熟", "title": "生产生活服务", "body": "生产生活服务——13%、9%、6%税率：\n· 研发和技术服务（6%）：包括研发服务、合同能源管理服务、工程勘察勘探服务、专业技术服务(如气象服务、地震服务、海洋服务、测绘服务、城市规划、环境与生态监测服务等专项技术服务)。\n· 信息技术服务（6%）：包括软件服务、电路设计及测试服务、信息系统服务(如提供信息系统集成、网络管理、基础信息技术管理平台整合、信息技术基础设施管理、数据中心、托管中心、信息安全服务、在线杀毒、虚拟主机等业务活动)、业务流程管理服务和信息系统增值服务。\n· 文化创意服务（6%）：包括设计服务、知识产权服务、广告服务和会议展览服务。宾馆、旅馆、旅社、度假村和其他经营性住宿场所提供会议场地及配套服务的活动，按照“会议展览服务”缴纳增值税；广告代理属于“文化创意服务——广告服务”，不属于“商务辅助服务——经纪代理服务”。\n· 物流辅助服务（6%）：包括航空服务(含航空地面服务和通用航空服务)、港口码头服务、货运客运场站服务、打捞救助服务、装卸搬运服务、仓储服务、收派服务。港口设施经营人收取的港口设施保安费按照“港口码头服务”缴纳增值税；快递企业提供快递服务取得的收入，按照“收派服务”缴纳增值税。\n· 租赁服务（13%、9%）：形式包括融资租赁服务和经营租赁服务；租赁对象包括不动产(9%)、有形动产(13%)。水路运输的光租业务、航空运输的干租业务，按照“有形动产经营租赁服务”缴纳增值税；将建筑物、构筑物等不动产的广告位出租给其他单位或个人用于发布广告，按照“不动产经营租赁服务”缴纳增值税；将飞机、车辆等动产的广告位出租给其他单位或个人用于发布广告，按照“有形动产经营租赁服务”缴纳增值税；车辆停放服务、道路通行服务(包括过路费、过桥费、过闸费等)按照“不动产经营租赁服务”缴纳增值税。\n· 鉴证咨询服务（6%）：包括认证服务、鉴证服务和咨询服务。鉴证服务包括会计鉴证、税务鉴证、法律鉴证、工程监理、资产评估、环境评估、房地产土地评估、建筑图纸审核、医疗事故鉴定等；翻译服务、市场调查服务按照“咨询服务”缴纳增值税。\n· 广播影视服务（6%）：包括广播影视节目(作品)的制作服务、发行服务、播映(含放映)服务。\n· 商务辅助服务（6%）：包括企业管理服务(如物业管理)、经纪代理服务(如金融代理、知识产权代理、货物运输代理、代理报关、法律代理、房地产中介、婚姻中介、拍卖等)、人力资源服务、安全保护服务(如武装守护押运、安全系统监控等)。\n· 文化体育服务（6%）：包括文化服务和体育服务。文化服务包括文艺创作、文艺表演、文化比赛，档案馆的档案管理，文物及非物质文化遗产保护，提供游览场所等；纳税人在游览场所经营索道、摆渡车、电瓶车、游船等取得的收入，按照“文化服务”缴纳增值税。\n· 教育医疗服务（6%）：包括教育服务和医疗服务。教育服务是指提供学历教育服务、非学历教育服务、教育辅助服务的业务活动；非学历教育服务包括学前教育、各类培训、演讲、讲座、报告会等；教育辅助服务包括教育测评、考试、招生等服务。\n· 旅游娱乐服务（6%）：包括旅游服务和娱乐服务。\n· 餐饮住宿服务（6%）：包括餐饮服务和住宿服务。\n· 居民日常服务（6%）：包括市容市政管理、家政、婚庆、育养、殡葬、照料和护理、美容美发、按摩、桑拿、沐浴、洗染、摄影扩印等服务。\n· 加工修理修配服务（13%）：加工，指受托加工货物，即委托方提供原材料及主要材料，受托方按照委托方的要求，制造货物并收取加工费的业务；修理修配，指受托对损伤和丧失功能的货物进行修复，使其恢复原状和功能的业务。\n· 其他生产生活服务（6%）：指上述列举以外的生产生活服务。"}, {"id": "ch2-11", "chapter": "第二章 增值税", "tag": "考点01 · 征税范围 · 熟", "title": "销售无形资产、销售不动产、进口货物", "body": "销售无形资产——9%、6%税率：\n· 无形资产，包括技术、商标、著作权、商誉、自然资源使用权和其他无形资产。自然资源使用权，包括土地使用权、海域使用权、探矿权、采矿权、取水权和其他自然资源使用权。其他无形资产，包括基础设施资产经营权、公共事业特许权、配额、经营权(包括特许经营权、连锁经营权、其他经营权)、经销权、分销权、代理权、会员权、席位权、网络游戏虚拟道具、域名、名称权、肖像权、冠名权、转会费以及其他不具实物形态，但能带来经济利益的资产。\n· 销售无形资产，是指有偿转让无形资产所有权或者使用权的业务活动（包括“卖”无形资产即所有权转移，也包括“租”无形资产即使用权转移）。\n销售不动产——9%税率：\n· 不动产，是指不能移动或者移动后会引起性质、形状改变的财产，包括建筑物、构筑物等。\n· 销售不动产，是指有偿转让不动产所有权的业务活动。\n· 转让建筑物有限产权或者永久使用权的，转让在建的建筑物或者构筑物所有权的，按照“销售不动产”缴纳增值税。\n· 在转让建筑物或者构筑物时一并转让其所占土地的使用权的，按照“销售不动产”缴纳增值税。（“房地一体”原则）\n进口货物：\n· 进口货物，是指申报进入我国海关境内的货物。"}, {"id": "ch2-12", "chapter": "第二章 增值税", "tag": "考点02 · 征税范围 · 精", "title": "境内销售的界定", "body": "· 境内销售货物：货物的起运地或所在地在境内。\n· 销售或者租赁不动产、转让自然资源使用权：不动产、自然资源所在地在境内。\n· 销售金融商品：金融商品在境内发行，或者销售方为境内单位和个人。\n· 其他在境内销售服务、无形资产：\n  (1)服务、无形资产在境内消费：①境外单位或者个人向境内单位或者个人销售服务、无形资产，在境外现场消费的服务除外；②境外单位或者个人销售的服务、无形资产与境内的货物、不动产、自然资源直接相关；③国务院财政、税务主管部门规定的其他情形。\n  (2)销售方为境内单位和个人。"}, {"id": "ch2-13", "chapter": "第二章 增值税", "tag": "考点03 · 征税范围 · 精", "title": "视同应税交易的征税规定", "body": "适用主体和情形：\n· 单位和个体工商户：将自产或委托加工的货物用于集体福利或者个人消费，视同应税交易。（无自然人）\n· 单位和个人：将自产、委托加工、外购的货物无偿转让，视同应税交易；将无形资产、不动产或者金融商品无偿转让，视同应税交易。\n不同来源货物用于不同用途的增值税处理：\n· 用于集体福利、个人消费：自产及委托加工的货物视同应税交易（对内使用，防止漏税），计算销项税额，可以按规定抵扣进项税额；外购的货物不视同应税交易（对内使用，最终消费），不算销项税额，也不得抵扣进项税额。\n· 用于无偿转让：视同应税交易（对外使用，继续流转，保证链条完整），计算销项税额，可以按规定抵扣进项税额。\n其他规定：\n· 视同应税交易的规定不含无偿提供服务（无偿转让金融商品除外），如集团内无偿资金拆借、无偿咨询、无偿技术服务等，均不视同应税交易缴纳增值税。\n· 纳税人以不具有合理商业目的的安排减少、免除、推迟缴纳增值税的，税务机关可依据《税收征收管理法》和有关行政法规调整。\n· 注意区分“无偿提供服务”与“无偿转让无形资产、不动产”，后者仍需视同应税交易。"}, {"id": "ch2-14", "chapter": "第二章 增值税", "tag": "考点04 · 征税范围 · 精", "title": "纳税人涉及多项应税交易的征税规定", "body": "(一)纳税人发生一项应税交易涉及两个以上税率、征收率的(混合经营)：\n· 一般规定：按照应税交易的主要业务适用税率、征收率。（“从主业交税”原则）强调同一项应税交易包含两个以上涉及不同税率、征收率的业务；业务之间具有明显的主附关系。\n· 特定情形的具体规定：①销售软件产品的同时提供的软件安装、维护、培训等服务，适用软件产品的税率；②销售活动板房、机器设备、钢结构件等货物的同时提供的安装服务，适用货物的税率；③充换电业务中销售电力产品的同时收取的蓄电池更换、定位、维护等服务费，适用电力产品的税率；④提供交通工具租赁服务的同时收取的信息技术等服务费，适用租赁服务的税率。纳税人发生的与上述情形类似的应税交易，比照执行。\n(二)纳税人发生两项以上应税交易涉及不同税率、征收率(兼营行为)：\n· 分别核算销售额的，分别适用不同税率或者征收率征税。\n· 未分别核算销售额的，从高适用税率征税。"}, {"id": "ch2-15", "chapter": "第二章 增值税", "tag": "考点05 · 征税范围 · 精", "title": "特殊销售的征税规定", "body": "(一)处置罚没财产：\n· 执罚部门和单位处置罚没财产，相关收入作为罚没收入由执罚部门和单位如数上缴财政的，免征增值税。\n· 对经营单位购入罚没财产再销售的，照章征收增值税。\n(二)预付卡业务的征税规定：\n1.单用途商业预付卡(单用途卡)——特点：仅限于在本企业、本企业所属集团或者同一品牌特许经营体系内兑付货物或者服务。涉及发卡企业或售卡企业、持卡人、销售方之间的关系。\n· 售卡方预收款：销售单用途卡，或者接受单用途卡持卡人充值取得的预收资金，不缴纳增值税，可以开具增值税普通发票，不得开具增值税专用发票。\n· 售卡方收佣金：因发行或者销售单用途卡并办理相关资金收付结算业务取得的手续费、结算费、服务费、管理费等收入，缴纳增值税。\n· 销售方销售货物或服务：持卡人使用单用途卡购买货物或服务，缴纳增值税，且不得向持卡人开具增值税发票。\n· 销售方结算：收到售卡方结算的销售款，应向售卡方开具增值税普通发票，不得开具增值税专用发票。\n2.支付机构预付卡(多用途卡)——多用途卡，是指发卡机构以特定载体和形式发行的，可在发卡机构之外购买货物或服务的预付价值。涉及有资质的支付机构、持卡(购卡、充值)人、特约商户之间的关系。\n· 支付机构预收款：销售多用途卡、接受多用途卡持卡人充值取得的资金，不缴纳增值税，可以开具增值税普通发票，不得开具增值税专用发票。\n· 支付机构收佣金：因发行或者受理多用途卡并办理相关资金收付结算业务取得的手续费、结算费、服务费、管理费等收入，缴纳增值税。\n· 特约商户销售货物或服务：持卡人使用多用途卡购买货物或服务，缴纳增值税，且不得向持卡人开具增值税发票。\n· 特约商户结算：收到支付机构结算的销售款，应向支付机构开具增值税普通发票，不得开具增值税专用发票。\n3.发售加油卡、加油凭证销售成品油的纳税人在售卖加油卡、加油凭证时，应按预收账款方法作相关账务处理，不征收增值税。"}, {"id": "ch2-16", "chapter": "第二章 增值税", "tag": "考点06 · 征税范围 · 精", "title": "不征收增值税的项目", "body": "1.有下列情形之一的，不属于应税交易，不征收增值税：\n· 员工为受雇单位或者雇主提供取得工资、薪金的服务。\n· 收取行政事业性收费、政府性基金。\n· 依照法律规定被征收、征用而取得补偿。\n· 取得存款利息收入。\n2.药品生产企业销售自产创新药的销售额，为向购买方收取的全部价款，其提供给患者后续免费使用的相同创新药，不属于增值税视同应税交易范围。\n3.纳税人通过合并、分立、出售、置换等方式实施资产重组，符合下列条件的，不属于增值税应税交易，涉及的货物、金融商品、无形资产、不动产(以下统称“资产”)转让，不征收增值税，对应的进项税额可以抵扣：\n· 资产重组的标的是可以相对独立运营的经营业务。\n· 纳税人实施资产重组时，应当将全部或者部分资产，与相关联的对应债权、负债和员工共同组成资产包，一并转让。资产包中应当同时包括资产、债权、负债和员工。\n· 资产重组应当具有合理的商业目的，且不以减少、免除、推迟缴纳增值税税款或者提前退税、多退税款为主要目的。\n· 资产重组的转让方属于一般纳税人的，接收方也应当属于一般纳税人。\n（资产重组不征税关键：“资产+相关联债权债务+劳动力(人员安置)”三要素必须同时转让。）\n4.纳税人取得的财政补贴收入，与其销售货物、服务、无形资产、不动产的收入或者数量直接挂钩的，应按规定计算缴纳增值税。纳税人取得的其他情形的财政补贴收入，不属于增值税应税收入，不征收增值税。"}, {"id": "ch2-17", "chapter": "第二章 增值税", "tag": "考点01 · 税率和征收率 · 精", "title": "我国增值税的税率", "body": "税率的适用情形：一般计税方法(一般纳税人)、进口货物；扣缴计税方法。征收率的适用情形：简易计税方法(小规模纳税人及一般纳税人的特定行为)。\n· 基本税率13%：销售或进口绝大部分的货物，提供的加工、修理修配服务，销售有形动产租赁服务。\n· 低税率9%：①销售或进口税法列举的低税率货物(后面详述)；②提供交通运输服务、邮政服务、基础电信服务、建筑服务、不动产租赁服务；③销售不动产；④转让土地使用权。\n· 低税率6%：①销售增值电信服务、金融服务、生产生活服务(租赁服务除外)；②销售无形资产(转让土地使用权除外)。\n· 零税率0：①出口货物，国务院另有规定的除外；②境内单位和个人跨境销售国务院规定范围内的服务、无形资产。"}, {"id": "ch2-18", "chapter": "第二章 增值税", "tag": "考点02 · 税率和征收率 · 精", "title": "9%税率货物适用的范围——具体范围", "body": "(一)具体范围\n1.农产品、食用植物油、食用盐。(基本温饱)\n2.自来水、暖气、冷气、热水、煤气、石油液化气、天然气、二甲醚、沼气、居民用煤炭制品。(生活能源)\n3.图书、报纸、杂志、音像制品、电子出版物。(精神文明)\n4.饲料、化肥、农药、农机、农膜。(农业生产)"}, {"id": "ch2-19", "chapter": "第二章 增值税", "tag": "考点02 · 税率和征收率 · 精", "title": "9%税率货物适用的范围——详细规定", "body": "(二)详细规定\n· 农产品：是指初级农产品，包括农、林、牧、渔业。包括：①面粉、面皮、挂面、米、灭菌乳、巴氏杀菌乳、鲜奶、玉米面、玉米胚芽、各种毛茶、水果、果干、干果、果仁、芳香油料植物、盐水竹笋、肉类生制品；②晾烟叶、晒烟叶、初烤烟叶。不包括：玉米纤维、玉米蛋白粉、淀粉、速冻食品、方便面、副食品、各种熟食品、豆制品(如豆腐、豆皮等)、蔬菜罐头、水果罐头、果脯、蜜饯、中成药、调制乳、酸奶、边销茶、精制茶、肉类熟制品、燕窝、干鱼翅、动物排泄物等，按13%税率征收增值税。\n· 自来水：不包括农业灌溉用水、引水工程输送的水。\n· 暖气、热水：包括利用工业余热生产、回收的暖气、热气和热水。\n· 天然气：包括气田天然气、油田天然气、煤矿天然气和其他天然气；西气东输项目上游中外合作开采的天然气。\n· 石油液化气：包括由石油伴生气加工压缩而成的石油液化气。\n· 二甲醚：节约资源的产品，给予低税率照顾。\n· 居民用煤炭制品：不包括原煤和工业用煤。\n· 图书、报纸、杂志：包括中小学课本配套产品(包括各种纸制品或图片)。\n· 饲料：①不包括直接用于动物饲养的粮食、饲料添加剂；②豆粕、宠物饲料、饲用鱼油、矿物质微量元素舔砖，按“饲料”征收增值税。\n· 化肥：硝酸铵不属于化肥的征税范围。\n· 农药、农机、农膜：①农机指农机整机，包括拖拉机、农业运输机械(不含农用汽车)、小农具、蔬菜清洗机等；②农机零部件适用13%税率；③用于人类日常生活的各种类型包装的日用卫生用药(如卫生杀虫剂、驱虫剂、驱蚊剂、蚊香等)，不属于农药范围，适用13%税率。"}, {"id": "ch2-20", "chapter": "第二章 增值税", "tag": "考点03 · 税率和征收率 · 熟", "title": "零税率的适用范围", "body": "(一)纳税人出口货物(国务院另有规定除外)：出口货物，是指向海关报关实际离境并销售给境外单位或者个人的货物，以及国务院规定的视同出口的货物。\n(二)国际运输服务、航天运输服务、对外修理修配服务：\n· 国际运输服务，是指：①在境内载运旅客或者货物出境；②在境外载运旅客或者货物入境；③在境外载运旅客或者货物。\n· 航天运输服务，是指利用火箭等载体将卫星、空间探测器等空间飞行器发射到空间轨道的业务活动。\n· 对外修理修配服务，是指对进境复出口货物或者从事国际运输的运输工具进行的修理修配。\n(三)向境外单位销售的完全在境外消费的下列服务、无形资产(10项)：转让技术、离岸服务外包业务、合同能源管理服务、软件服务、信息系统服务、业务流程管理服务、研发服务、电路设计和测试服务、设计服务、广播影视制作和发行服务。\n· 向境外单位提供的完全在境外消费的广播影视节目(作品)的播映服务，免征增值税。\n· 完全在境外消费，是指：①服务的实际接受方在境外，且与境内的货物、不动产、自然资源无关；②无形资产完全在境外使用，且与境内的货物、不动产、自然资源无关；③财政部和国家税务总局规定的其他情形。\n(四)国际运输服务和港澳台运输服务增值税零税率[退(免)税]、免税政策其他适用规定：\n· 按照国家有关规定应取得相关资质的国际运输服务项目，纳税人取得相关资质的，适用增值税退(免)税政策；未取得相关资质的，适用增值税免税政策。\n· 境内单位和个人以无运输工具承运方式提供的国际运输服务：境内实际承运人适用增值税退(免)税；无运输工具承运业务的经营者适用免税。\n· 跨境程租、期租和湿租业务增值税退(免)税政策的适用：境内的单位或个人提供程租服务，如果租赁的交通工具用于国际运输服务和港澳台运输服务，适用方为出租方；境内的单位或个人向境内单位或个人提供期租、湿租服务，如果承租方利用租赁的交通工具向其他单位或个人提供国际运输服务和港澳台运输服务，适用方为承租方；境内的单位或个人向境外单位或个人提供期租、湿租服务，适用方为出租方。\n（零税率[增值税退(免)税]政策的适用方为实际提供国际运输服务的一方。）"}, {"id": "ch2-21", "chapter": "第二章 增值税", "tag": "考点04 · 税率和征收率 · 精", "title": "我国增值税的征收率", "body": "(一)征收率适用情况：\n· 增值税小规模纳税人发生应税交易。\n· 增值税一般纳税人发生选择适用简易计税方法的应税交易。\n（简易计税方法下，才会用到征收率。）\n(二)征收率的应用：\n· 我国增值税的法定征收率是3%；一般纳税人发生部分选择适用简易计税方法的应税交易适用3%，在一些特殊条件下或针对一些特殊业务实施更低比例的征收率。\n· 使用征收率计税意味着纳税人采用简易计税办法计税，不能抵扣该项目相关的进项税额。\n· 征收率乘以不含税销售额计算的税额是应纳税额，而不是销项税额。"}, {"id": "ch2-22", "chapter": "第二章 增值税", "tag": "考点01 · 税收优惠 · 精", "title": "法定的免税项目", "body": "1.农业生产者销售的自产农产品。\n· 农业生产者，包括从事农业生产的单位和个人。对单位和个人销售的外购农产品(蔬菜、部分鲜活肉蛋产品除外)，以及单位和个人外购农产品生产、加工后销售的仍属于规定范围的农业产品，不属于免税的范围，正常征税。\n· 农产品，是指适用9%税率的初级农产品。\n2.农业机耕、排灌、病虫害防治、植物保护、农牧保险以及相关技术培训业务，家禽、牲畜、水生动物的配种和疾病防治。相关技术培训，是指与农业机耕、排灌、病虫害防治、植物保护业务相关以及为使农民获得农牧保险知识的技术培训业务；家禽、牲畜、水生动物的配种和疾病防治，包括与该项服务有关的提供药品和医疗用具的业务。\n3.医疗机构提供的医疗服务：是指医疗机构按照不高于地市级以上医疗保障部门牵头制定的医疗服务价格，为就医者提供规定的各项服务，以及医疗机构向社会提供卫生防疫、卫生检疫的服务。（医疗机构不包括营利性美容医疗机构。）\n4.托儿所、幼儿园提供的育养服务：免征增值税的收入是指有关收费标准规定以内的保育费、保育教育费，超标收费、以开办实验班、特色班和兴趣班等名义收取的费用以及与入托、入园挂钩的赞助费、支教费等超过规定范围的各种费用，不属于免征增值税的范围。\n5.学校提供的学历教育服务：学校是指依据有关规定设立的提供学历教育的机构，以及技工学校、高级技工学校、技师学院，不包括职业培训机构等国家不承认学历的教育机构。\n6.学生勤工俭学提供的服务。\n7.婚姻介绍服务。\n8.养老机构提供的育养服务。\n9.殡葬服务。\n10.残疾人个人提供的服务。\n11.残疾人服务机构提供的育养服务。\n12.由残疾人的组织直接进口供残疾人专用的物品。\n13.古旧图书。\n14.纪念馆、博物馆、文化馆、文物保护单位管理机构、美术馆、展览馆、书画院、图书馆举办文化活动的门票收入，宗教场所举办文化、宗教活动的门票收入。门票收入，是指第一道门票收入。\n15.直接用于科学研究、科学试验和教学的进口仪器、设备。\n16.外国政府、国际组织无偿援助的进口物资和设备。\n17.自然人销售自己使用过的物品(动产)。"}, {"id": "ch2-23", "chapter": "第二章 增值税", "tag": "考点02 · 税收优惠 · 熟", "title": "特定减免税项目——销售货物", "body": "(一)销售货物（下列1～5政策执行期间为2026年1月1日至2027年12月31日）：\n1.国有粮食购销企业优惠：\n· 对承担粮食收储任务的国有粮食购销企业销售的粮食免征增值税。其他粮食企业经营粮食，除经营军队用粮、救灾救济粮、水库移民口粮之外，一律征收增值税。\n· 自2014年5月1日起，对承担粮食收储任务的国有粮食购销企业销售的粮食增值税免税政策适用范围由粮食扩大到粮食和大豆，并可对免税业务开具增值税专用发票。\n2.政府储备食用植物油的销售免征增值税，对其他销售食用植物油的业务，一律照章征收增值税。\n3.销售饲料产品免征增值税，免税饲料包括：①单一大宗饲料；②混合饲料；③配合饲料；④复合预混料；⑤浓缩饲料；⑥矿物质微量元素舔砖。\n· 宠物饲料不属于免征增值税的饲料。\n· 增值税一般纳税人销售或者进口符合规定的饲料，税率为9%(即9%常规税率，免税为优惠政策)。\n4.销售农膜、滴灌带、滴灌管和有机肥产品免征增值税。\n5.销售供残疾人专用的假肢、轮椅、矫型器(包括上肢矫型器、下肢矫型器、脊椎侧弯矫型器)免征增值税。\n6.蔬菜流通环节免征增值税：\n· 对从事蔬菜批发、零售的纳税人销售的蔬菜免征增值税，各种蔬菜罐头不属于免税范围。\n· 纳税人既销售蔬菜又销售其他增值税应税货物的，应分别核算蔬菜和其他增值税应税货物的销售额；未分别核算的，不得享受蔬菜增值税免税政策。\n7.部分鲜活肉蛋产品流通环节免征增值税：对从事农产品批发、零售的纳税人销售的部分鲜活肉蛋产品免征增值税。\n· 上述产品中不包括规定的国家珍贵、濒危野生动物及其鲜活肉类、蛋类产品。\n· 从事农产品批发、零售的纳税人既销售规定的部分鲜活肉蛋产品又销售其他增值税应税货物的，应分别核算上述鲜活肉蛋产品和其他增值税应税货物的销售额；未分别核算的，不得享受部分鲜活肉蛋产品增值税免税政策。\n8.供热企业的增值税优惠政策(至2027年供暖期结束)：\n· 对供热企业向居民个人(以下称“居民”)供热而取得的采暖费收入免征增值税。向居民供热取得的采暖费收入，包括供热企业直接向居民收取的、通过其他单位向居民收取的和由单位代居民缴纳的采暖费。\n· 免征增值税的采暖费收入应当单独核算。\n· 通过热力产品经营企业向居民供热的热力产品生产企业，应当根据热力产品经营企业实际从居民取得的采暖费收入占该经营企业采暖费总收入的比例，计算免征的增值税。"}, {"id": "ch2-24", "chapter": "第二章 增值税", "tag": "考点02 · 税收优惠 · 熟", "title": "特定减免税项目——销售服务", "body": "(二)销售服务(金融服务除外)（下列1～8政策执行期间为2026年1月1日至2027年12月31日），下列项目免征增值税：\n1.军队转业干部就业。(3年内免征增值税)\n2.随军家属就业。(3年内免征增值税)\n3.福利彩票、体育彩票的发行收入。\n4.社会团体收取的会费。\n5.高校学生食堂为高校师生提供餐饮服务取得的收入。\n6.家政服务企业由员工制家政服务员提供家政服务取得的收入。\n7.纳税人提供的直接或者间接国际货物运输代理服务。\n8.中国邮政集团有限公司及其所属邮政企业提供的邮政普遍服务和邮政特殊服务。\n9.法律援助人员按照规定获得的法律援助补贴。\n10.台湾航运公司、航空公司从事海峡两岸海上直航、空中直航业务在大陆取得的运输收入。"}, {"id": "ch2-25", "chapter": "第二章 增值税", "tag": "考点02 · 税收优惠 · 熟", "title": "特定减免税项目——金融服务", "body": "(三)金融服务，下列项目免征增值税：\n1.利息收入（(1)～(4)政策执行期间为2026年1月1日至2027年12月31日）：\n· (1)国家助学贷款。\n· (2)统借统还业务中，企业集团或企业集团中的核心企业以及集团所属财务公司按不高于支付给金融机构的借款利率水平或者支付的债券票面利率水平，向企业集团或者集团内下属单位收取的利息。\n· (3)住房公积金管理中心用住房公积金在指定的委托银行发放的个人住房贷款。\n· (4)金融同业往来：①金融机构与人民银行所发生的资金往来业务，包括人民银行对一般金融机构贷款，以及人民银行对商业银行的再贴现等；②银行联行往来业务，包括同一银行系统内部不同行、处之间所发生的资金账务往来业务；③金融机构间的资金往来业务，是指经人民银行批准，进入全国银行间同业拆借市场的金融机构之间通过全国统一的同业拆借网络进行的短期(一年以下，含一年)无担保资金融通行为；④金融机构开展同业存款、同业借款、同业代付、买断式买入返售金融商品、质押式买入返售金融商品、同业存单，取得的利息收入。\n· (5)境外机构投资我国在境外发行的国债、地方政府债券。(执行期间2025年8月8日至2027年12月31日)\n· (6)2025年8月8日之前已发行(包含在2025年8月8日之后续发行的部分)的国债、地方政府债券、金融债券。(自2025年8月8日起，对在该日期之后(含当日)新发行的国债、地方政府债券、金融债券的利息收入，恢复征收增值税。)\n· (7)人民银行对金融机构的贷款。\n· (8)外汇管理部门在从事国家外汇储备经营过程中，委托金融机构发放的外汇贷款。\n2.保险公司开办的一年期以上人身保险产品取得的保费收入。(执行期间2026年1月1日至2027年12月31日)保险公司开办一年期以上人身保险，在保险监管部门出具备案回执或批复文件前依法取得保费收入，免征增值税。（境内保险公司向境外保险公司提供的完全在境外消费的再保险服务，免征增值税。）\n3.金融商品转让收入（(1)～(3)政策执行期间为2026年1月1日至2027年12月31日）：\n· (1)合格境外投资者(QFII)、人民币合格境外机构投资者(RQFII)委托境内公司在我国从事证券买卖业务。\n· (2)公募证券投资基金(封闭式证券投资基金，开放式证券投资基金)管理人运用基金买卖股票、债券。\n· (3)经中国人民银行认可的境外机构投资银行间本币市场取得的收入。\n· (4)香港市场投资者(包括单位和个人)通过沪港通、深港通买卖上海证券交易所、深圳证券交易所上市A股。\n· (5)香港市场投资者(包括单位和个人)通过基金互认买卖内地基金份额。\n· (6)个人从事金融商品转让业务。\n4.被撤销金融机构以货物、不动产、无形资产、有价证券、票据等财产清偿债务。\n5.创新企业境内发行存托凭证(CDR)试点阶段有关税收政策：\n· 个人：转让创新企业CDR取得的差价所得，暂免。\n· 单位：转让创新企业CDR取得的差价所得，按金融商品转让征免。\n· 合格境外机构投资者(QFII)、人民币合格境外机构投资者(RQFII)委托境内公司：转让创新企业CDR取得的差价所得暂免；持有创新企业CDR取得的股息红利所得不交。\n· 公募证券投资基金管理人运营基金过程中：转让创新企业CDR取得的差价所得暂免。(2026.1.1—2027.12.31)\n6.全国社会保障基金有关投资业务税收政策，免税收入包括：①提供贷款服务取得的全部利息及利息性质的收入；②金融商品转让：\n· 全国社会保障基金理事会、全国社会保障基金投资管理人：运用全国社会保障基金投资过程中。\n· 全国社会保障基金理事会及养老基金投资管理机构：在国务院批准的投资范围内，运用养老基金投资过程中。\n· 承接主体：在运用划转的国有股权和现金收益投资过程中。\n（承接主体，是指《国务院关于印发划转部分国有资本充实社保基金实施方案的通知》(国发〔2017〕49号)规定的负责国有股权及现金收益运作管理的主体，包括：全国社会保障基金理事会以及由各省、自治区、直辖市人民政府设立的负责集中持有、管理和运营划转国有股权的国有独资公司或受托对划转国有股权实行专户管理的具有国有资本投资运营功能的公司等。）"}, {"id": "ch2-26", "chapter": "第二章 增值税", "tag": "考点02 · 税收优惠 · 熟", "title": "特定减免税项目——销售无形资产、销售不动产及不动产租赁服务、进口货物", "body": "(四)销售无形资产，下列项目免征增值税(执行期间2026年1月1日至2027年12月31日)：\n1.个人转让著作权。\n2.纳税人提供技术转让、技术开发和与之相关的技术咨询、技术服务。\n(五)销售不动产及不动产租赁服务：\n1.下列项目免征增值税：\n· 按照国家规定的收费标准向学生收取的高校学生公寓住宿费收入。（(1)～(2)政策执行期间为2026年1月1日至2027年12月31日）\n· 企业、行政事业单位按房改成本价、标准价出售住房取得的收入。\n· 涉及家庭财产分割的个人无偿转让不动产、土地使用权。家庭财产分割，包括下列情形：离婚财产分割；无偿赠与配偶、父母、子女、祖父母、外祖父母、孙子女、外孙子女、兄弟姐妹；无偿赠与对其承担直接抚养或者赡养义务的抚养人或者赡养人；房屋产权所有人死亡，法定继承人、遗嘱继承人或者受遗赠人依法取得房屋产权。\n· 农业生产用地：①将土地使用权转让给农业生产者用于农业生产；②采取转包、出租、互换、转让、入股等方式将承包地流转给农业生产者用于农业生产；③将国有农用地出租给农业生产者用于农业生产。\n· 土地所有者出让土地使用权和土地使用者将土地使用权归还给土地所有者。土地所有者依法征收土地，并向土地使用者支付土地及其相关有形动产、不动产补偿费的行为，属于土地使用者将土地使用权归还给土地所有者的情形。\n· 县级以上地方人民政府或自然资源行政主管部门出让、转让或收回自然资源使用权(不含土地使用权)。\n· 个人(不含个体工商户中的一般纳税人)销售自建自用住房。\n2.个人(不含个体工商户中的一般纳税人，下同)将购买的住房对外销售的税收优惠：\n· 个人将购买不足2年的住房对外销售的，按照3%征收率全额缴纳增值税。应纳增值税额=含税销售额/(1+3%)×3%。\n· 个人将购买2年以上(含2年)的住房对外销售的，免征增值税。\n3.个人(不含个体工商户中的一般纳税人)出租住房，应按照3%征收率减按1.5%计算应纳增值税。\n(六)进口货物：\n1.对科学研究机构、技术开发机构、学校、党校(行政学院)、图书馆进口国内不能生产或性能不能满足需要的科学研究、科技开发和教学用品，免征进口关税和进口环节增值税、消费税。\n2.对出版物进口单位为科学研究机构、技术开发机构、学校、党校(行政学院)、图书馆进口用于科研、教学的图书、资料，免征进口环节增值税。\n3.自2018年5月1日起，对进口抗癌药品，减按3%征收进口环节增值税；自2019年3月1日起，对进口罕见病药品，减按3%征收进口环节增值税。"}, {"id": "ch2-27", "chapter": "第二章 增值税", "tag": "考点03 · 税收优惠 · 熟", "title": "临时减免税项目（一）", "body": "(一)孵化服务：自2019年1月1日至2027年12月31日，对国家级、省级科技企业孵化器、大学科技园和国家备案众创空间向在孵对象提供孵化服务取得的收入，免征增值税。\n· 在孵对象，是指符合相关认定和管理办法规定的孵化企业、创业团队和个人。孵化服务，是指为在孵对象提供的经纪代理、经营租赁、研发和技术、信息技术、鉴证咨询服务。\n· 国家级、省级科技企业孵化器、大学科技园和国家备案众创空间应当单独核算孵化服务收入。\n· 国家级科技企业孵化器、大学科技园和国家备案众创空间认定和管理办法由国务院科技、教育部门发布；省级科技企业孵化器、大学科技园认定和管理办法由省级科技、教育部门发布。\n· 2024年1月1日以后认定的国家级、省级科技企业孵化器、大学科技园和国家备案众创空间，自认定之日次月起享受税收优惠政策。被取消资格的，自取消资格之日次月起停止享受税收优惠政策。\n(二)经营公租房：自2019年1月1日至2027年12月31日，对经营公租房所取得的租金收入，免征增值税。公租房经营管理单位应单独核算公租房租金收入，未单独核算的，不得享受免征增值税优惠政策。\n(三)文化企业：自2019年1月1日至2027年12月31日，对电影主管部门(包括中央、省、地市及县级)按照各自职能权限批准从事电影制片、发行、放映的电影集团公司(含成员企业)、电影制片厂及其他电影企业取得的销售电影拷贝(含数字拷贝)收入、转让电影版权(包括转让和许可使用)收入、电影发行收入以及在农村取得的电影放映收入，免征增值税；对广播电视运营服务企业收取的有线数字电视基本收视维护费和农村有线电视基本收视费，免征增值税；党报、党刊将其发行、印刷业务及相应的经营性资产剥离组建的文化企业，自注册之日起所取得的党报、党刊发行收入和印刷收入，免征增值税。\n(四)社区家庭服务业：自2019年6月1日至2027年12月31日，下列收入免征增值税：\n· 为社区提供养老、托育、家政等服务的机构，提供社区养老、托育、家政服务取得的收入。\n· 符合条件的家政服务企业提供家政服务取得的收入。\n(五)边销茶：自2021年1月1日至2027年12月31日，对边销茶生产企业销售自产的边销茶及经销企业销售的边销茶，免征增值税。边销茶，是指以黑毛茶、老青茶、红茶末、绿茶为主要原料，经过发酵、蒸制、加压或者压碎、炒制，专门销往边疆少数民族地区的紧压茶。\n(六)抗病毒药品：\n· 自2019年1月1日至2027年12月31日，继续对国产抗艾滋病病毒药品免征生产环节和流通环节增值税。抗艾滋病病毒药品的生产企业和流通企业应分别核算免税药品和其他货物的销售额；未分别核算的，不得享受增值税免税政策。\n· 自2021年1月1日至2030年12月31日，对卫生健康委委托进口的抗艾滋病病毒药物，免征进口关税和进口环节增值税。\n(七)农村饮水安全工程：自2019年1月1日至2027年12月31日，饮水工程运营管理单位向农村居民提供生活用水取得的自来水销售收入，免征增值税。\n(八)科普单位的科普活动：自2018年1月1日至2027年12月31日，对科普单位的门票收入，以及县级及以上党政部门和科协开展科普活动的门票收入，免征增值税。企业开展科普活动取得的收入照章征税。"}, {"id": "ch2-28", "chapter": "第二章 增值税", "tag": "考点03 · 税收优惠 · 熟", "title": "临时减免税项目（二）", "body": "(九)金融机构发放小额贷款及其他事项：\n1.自2018年9月1日至2027年12月31日，对金融机构向小型企业、微型企业和个体工商户发放小额贷款取得的利息收入，免征增值税。\n· 金融机构可以选择以下两种方法之一适用免税：①对金融机构向小型企业、微型企业和个体工商户发放的，利率水平不高于全国银行间同业拆借中心公布的贷款市场报价利率(LPR)150%(含本数)的单笔小额贷款取得的利息收入，免征增值税；高于LPR150%的单笔小额贷款取得的利息收入，按照现行政策规定缴纳增值税(起征点，盯利率)。②对金融机构向小型企业、微型企业和个体工商户发放单笔小额贷款取得的利息收入中，不高于该笔贷款按照LPR150%(含本数)计算的利息收入部分，免征增值税；超过部分按照现行政策规定缴纳增值税(免征额，盯利息)。\n· 金融机构可按会计年度在以上两种方法之间选定其一作为该年的免税适用方法，一经选定，该会计年度内不得变更。\n2.自2017年12月1日至2027年12月31日，对金融机构向农户发放小额贷款取得的利息收入，免征增值税。\n3.自2017年1月1日至2027年12月31日，对经省级地方金融监督管理部门批准成立的小额贷款公司取得的农户小额贷款利息收入，免征增值税。\n4.自2018年1月1日至2027年12月31日，纳税人为农户、小型企业、微型企业及个体工商户借款、发行债券提供融资担保取得的担保费收入，以及为上述融资担保(以下称“原担保”)提供再担保取得的再担保费收入，免征增值税。再担保合同对应多个原担保合同的，原担保合同应全部适用免征增值税政策。否则，再担保合同应按规定缴纳增值税。\n(十)境外机构投资境内债券市场：自2026年1月1日至2027年12月31日，对境外机构投资境内债券市场取得的债券利息收入，暂免征收增值税。\n(十一)货物期货交割：自2026年1月1日至2027年12月31日，对经国务院批准对外开放的货物期货品种保税交割业务，免征增值税。\n(十二)二手车经销企业销售旧车：自2020年5月1日至2027年12月31日，从事二手车经销业务的纳税人销售其收购的二手车，减按0.5%征收率征收增值税。\n· 应纳增值税=含税销售额÷(1+0.5%)×0.5%。\n· 纳税人应当开具二手车销售统一发票。为维护购买方纳税人的进项抵扣权益，购买方索取增值税专用发票的，纳税人应当再为其开具征收率为0.5%的增值税专用发票。如果购买方为消费者个人，从事二手车经销业务的纳税人不得为其开具增值税专用发票。\n· 自2022年10月1日起，对已备案汽车销售企业从自然人处购进二手车的，允许企业反向开具二手车销售统一发票并凭此办理转移登记手续。\n· 自2023年1月1日起，对自然人在一个自然年度内出售持有时间少于1年的二手车达到3辆及以上的，汽车销售企业、二手车交易市场、拍卖企业等不得为其开具二手车销售统一发票，不予办理交易登记手续，有关部门按规定处理。\n(十三)进口种子种源：自2021年1月1日至2030年12月31日，对符合《进口种子种源免征增值税商品清单》的进口种子种源，免征进口环节增值税。\n(十四)图书批发、零售：自2021年1月1日起至2027年12月31日，免征图书批发、零售环节增值税。\n(十五)医疗机构受托提供服务：自2026年1月1日起至2027年12月31日，医疗机构接受其他医疗机构委托，按照不高于地市级以上医疗保障部门牵头制定的医疗服务价格(包括政府指导价和按照规定由供需双方协商确定的价格等)，提供《全国医疗服务价格项目规范》所列的各项服务，免征增值税。\n(十六)民用航空发动机和民用飞机(以下政策执行至2027年12月31日)：\n· 对纳税人从事大型民用客机发动机、中大功率民用涡轴涡桨发动机研制项目而形成的增值税期末留抵税额予以退还。\n· 对纳税人从事空载重量大于45吨的民用客机研制项目而形成的增值税期末留抵税额予以退还。\n· 对纳税人生产销售新支线飞机和空载重量大于25吨的民用喷气式飞机暂减按5%征收增值税，并对其因生产销售新支线飞机和空载重量大于25吨的民用喷气式飞机而形成的增值税期末留抵税额予以退还。\n· 纳税人符合规定的增值税期末留抵税额，可在初次申请退税时予以一次性退还。纳税人收到退税款项的当月，应将退税额从增值税进项税额中转出。\n(十七)消防救援设备：自2023年1月1日至2030年12月31日，对国家综合性消防救援队伍进口国内不能生产或性能不能满足需求的消防救援装备，免征进口关税和进口环节增值税、消费税。\n(十八)国有公益性收藏单位进口藏品：自2024年5月1日至2027年12月31日，国有公益性收藏单位以从事永久收藏、展示和研究等公益性活动为目的，通过接受境外捐赠、归还、追索和购买等方式进口的藏品，以及外交部、国家文物局进口的藏品，免征进口关税、进口环节增值税和消费税。"}, {"id": "ch2-29", "chapter": "第二章 增值税", "tag": "考点04 · 税收优惠 · 熟", "title": "增值税即征即退", "body": "(一)资源综合利用业务：\n· 增值税一般纳税人销售自产的资源综合利用产品和提供资源综合利用服务，可享受增值税即征即退政策，退税比例有30%、50%、70%、90%、100%五个档次。\n· 纳税人收购的再生资源，应按规定取得海关进口增值税专用缴款书、增值税发票、具有发票性质的收款凭证、相关税费缴纳凭证等，纳税人应当取得发票或凭证而未取得的，该部分再生资源对应产品的销售收入不得适用即征即退规定。\n· 纳税人应当在当期销售综合利用产品和服务销售收入中剔除不得适用即征即退政策部分的销售收入后，计算可申请的即征即退税额。\n· 纳税人申请享受增值税即征即退政策的，纳税缴费信用级别不为C级或D级。\n(二)软件产品：\n· 增值税一般纳税人销售其自行开发生产的软件产品，按13%税率征收增值税后，对其增值税实际税负超过3%的部分实行即征即退政策。即征即退税额=当期软件产品增值税应纳税额-当期软件产品销售额×3%。\n· 增值税一般纳税人将进口软件产品进行本地化改造后对外销售，其销售的软件产品可享受规定的增值税即征即退政策。本地化改造，是指对进口软件产品进行重新设计、改进、转换等，单纯对进口软件产品进行汉字化处理不包括在内。\n(三)安置残疾人：安置残疾人的单位和个体工商户，按安置残疾人的人数，限额即征即退增值税——安置每位残疾人每月可退还的增值税具体限额按月最低工资标准的4倍确定。纳税人新安置的残疾人从签订劳动合同并缴纳社会保险的次月起计算；减少的，从减少当月起计算。\n(四)黄金税收政策：\n1.会员单位或客户通过上海黄金交易所、上海期货交易所(以下称“交易所”)交易标准黄金：\n· 卖出方会员单位或客户销售标准黄金时，免征增值税。\n· 未发生实物交割出库的，交易所免征增值税。\n· 发生实物交割出库的，按买入方类型和用途适用增值税政策：①会员单位投资性用途——交易所实行增值税即征即退，并按实际成交价格向买入方开具增值税专用发票；买入方直接销售或加工成投资性黄金产品(不含央行批准的法定金质货币)的，按现行规定缴纳增值税，向购买方开具普通发票，不得开专票；加工成央行批准的法定金质货币(适用免征增值税政策的熊猫普制金币除外)的，按现行规定缴纳增值税，可向购买方开具增值税专用发票。②会员单位非投资性用途——免征增值税，并按实际成交价格向买入方开具普通发票；买入方若为增值税一般纳税人，可按“普通发票注明金额×6%”计算抵扣进项税额；加工成“非投资性黄金产品”后销售，按现行规定缴纳增值税，可向购买方开具增值税专用发票。③客户(不区分用途)——免征增值税，并按实际成交价格向客户开具普通发票；若为增值税一般纳税人，可按“普通发票注明金额×6%”计算抵扣进项税额；直接销售或加工后销售，按现行规定缴纳增值税，可向购买方开具增值税专用发票。\n2.纳税人不通过交易所销售标准黄金，应按照现行规定缴纳增值税。\n(五)管道运输服务(执行期间2026年1月1日至2027年12月31日)：一般纳税人提供管道运输服务，对其增值税实际税负超过3%的部分实行增值税即征即退政策。\n(六)风力发电：自2025年11月1日起至2027年12月31日，对纳税人销售自产的利用海上风力生产的电力产品，实行增值税即征即退50%政策。"}, {"id": "ch2-30", "chapter": "第二章 增值税", "tag": "考点05 · 税收优惠 · 识", "title": "增值税先征后退", "body": "自2021年1月1日至2027年12月31日，执行下列增值税先征后退政策。\n(一)对下列出版物在出版环节执行增值税100%先征后退的政策：\n1.中国共产党和各民主党派的各级组织的机关报纸和机关期刊，各级人大、政协、政府、工会、共青团、妇联、残联、科协的机关报纸和机关期刊，新华社的机关报纸和机关期刊，军事部门的机关报纸和机关期刊。\n2.专为少年儿童出版发行的报纸和期刊，中小学的学生教科书。\n3.专为老年人出版发行的报纸和期刊。\n4.少数民族文字出版物。\n5.盲文图书和盲文期刊。\n6.经批准在内蒙古、广西、西藏、宁夏、新疆五个自治区内注册的出版单位出版的出版物。\n7.列入名单的图书、报纸和期刊，如《半月谈》等。\n(二)对下列出版物在出版环节执行增值税50%先征后退的政策：\n1.各类图书、期刊、音像制品、电子出版物，规定执行增值税100%先征后退的出版物除外。\n2.列入名单的报纸。如综合类报纸中的国际时政类报纸、外宣类报纸、其他类报纸和行业专业类报纸中的经济类报纸等。\n(三)对下列印刷、制作业务执行增值税100%先征后退的政策：\n1.对少数民族文字出版物的印刷或制作业务。\n2.列入名单的新疆维吾尔自治区印刷企业的印刷业务。"}, {"id": "ch2-31", "chapter": "第二章 增值税", "tag": "考点06 · 税收优惠 · 熟", "title": "扣减增值税规定——退役士兵自主创业就业和重点群体创业就业", "body": "自2023年1月1日至2027年12月31日：\n1.自主就业退役士兵或脱贫人口(含防止返贫监测对象，下同)、持《就业创业证》(注明“自主创业税收政策”或“毕业年度内自主创业税收政策”)或《就业失业登记证》(注明“自主创业税收政策”)的人员，从事个体经营的，自办理个体工商户登记当月起，在3年(36个月)内按每户每年20000元为限额依次扣减其当年实际应缴纳的增值税、城市维护建设税、教育费附加、地方教育附加和个人所得税。\n· 享受优惠的，只能办个体户，不能办公司。\n· 限额标准最高可上浮20%，各省、自治区、直辖市人民政府可根据本地区实际情况在此幅度内确定具体限额标准。\n2.企业招用自主就业退役士兵，与其签订1年以上期限劳动合同并依法缴纳社会保险费的，自签订劳动合同并缴纳社会保险当月起，在3年内按实际招用人数予以定额每人每年6000元依次扣减增值税、城市维护建设税、教育费附加、地方教育附加和企业所得税优惠，定额标准最高可上浮50%。"}, {"id": "ch2-32", "chapter": "第二章 增值税", "tag": "考点07 · 税收优惠 · 精", "title": "起征点规定", "body": "(一)基本规定：\n1.小规模纳税人发生应税交易，销售额未达到起征点的，免征增值税；达到起征点的，依照规定全额计算缴纳增值税。\n2.起征点标准由国务院规定，报全国人民代表大会常务委员会备案。\n(二)增值税起征点标准：\n1.自2026年1月1日至2027年12月31日，小规模纳税人发生应税交易，起征点标准如下：\n· 以一个月为一个计税期间的，起征点为月销售额10万元。以一个季度为一个计税期间的，起征点为季度销售额30万元。\n· 按次纳税的，起征点为每次(日)销售额1000元。一日内发生多次应税交易的，按日适用起征点标准。\n2.小规模纳税人发生应税交易，按照规定以扣除相关价款后的余额计算销售额或者允许从含税销售额中扣除相关价款后计算应纳税额的，以扣除相关价款后的不含税余额，适用起征点标准。\n3.自然人发生下列情形，应当以当月发生全部应税交易的销售额，适用以一个月为一个计税期间的起征点标准：\n· 自然人取得2025年8月8日起(含当日)新发行国债、地方政府债券、金融债券的利息。一次性收取利息的，以对应计息期月均分摊的利息，确定月销售额。\n· 自然人出租不动产。一次性收取租金的，以对应租赁期月均分摊的租金，确定月销售额。\n· 互联网平台内从业人员自互联网平台企业取得服务收入，并由互联网平台企业按照规定办理增值税等税费代办申报。\n· 自然人报废产品出售者通过“反向开票”销售报废产品，并由资源回收企业按照规定办理增值税等税费代办申报。\n· 保险代理人为保险企业提供保险代理服务，并由保险企业按照规定办理增值税等税费代办申报。证券经纪人、信用卡和旅游行业代理人比照执行。\n4.自然人发生应税交易，除上述第3点外，应当实行按次纳税，销售额达到起征点的，按照以下规定办理申报纳税：\n· 向主管税务机关申请代开发票的，由主管税务机关在代开发票时征收增值税。\n· 有扣缴义务人的，由扣缴义务人按照规定向主管税务机关申报缴纳扣缴的增值税。\n· 除已征收和已被扣缴增值税的应税交易外，自然人本年度发生的其他尚未缴纳增值税的应税交易，应当按照规定，向主管税务机关申报纳税。\n(三)小规模纳税人优惠政策：\n1.自2026年1月1日至2027年12月31日，小规模纳税人发生除销售、出租不动产或者转让土地使用权之外的增值税应税交易，依照3%征收率减按1%征收率征收增值税；按规定预缴增值税的项目，当期在预缴地实现的全部价款、预收款(均不含增值税)合计达到增值税起征点的，减按1%预征率预缴增值税。减按1%征收增值税时，应纳增值税=含税销售额÷(1+1%)×1%。\n2.互联网平台从业人员增值税政策：从业人员自互联网平台企业取得服务收入，并由互联网平台企业按照规定办理增值税及附加税费代办申报的，从业人员自互联网平台企业取得的服务收入未达到起征点的，免征增值税，达到起征点的，适用3%征收率减按1%计算缴纳增值税政策。"}, {"id": "c02", "tag": "考点01 · 概述 · 识", "title": "概念", "body": "城市维护建设税（简称“城建税”）是对缴纳增值税、消费税（以下简称“两税”）的单位和个人征收的一种税。", "chapter": "第四章 城市维护建设税"}, {"id": "c03", "tag": "考点01 · 概述 · 识", "title": "三个特点", "body": "（1）属于附加税：以“两税”实缴税额之和为计税基础，随“两税”征收\n（2）征收范围较广：除特例外，凡缴“两税”的纳税人均需缴纳\n（3）根据城镇规模设计税率：体现地区差异，符合城市维护需求", "chapter": "第四章 城市维护建设税"}, {"id": "c04", "tag": "考点02 · 纳税人和扣缴义务人 · 识", "title": "纳税人 / 扣缴义务人", "body": "纳税人：缴纳消费税、增值税的单位和个人，包括外商投资企业和外国企业及外籍个人。\n\n扣缴义务人：负有增值税、消费税扣缴义务的单位和个人，在扣缴增值税、消费税的同时扣缴城市维护建设税。", "chapter": "第四章 城市维护建设税"}, {"id": "c05", "tag": "考点03 · 征税范围 · 熟", "title": "征税区域", "body": "包括城市市区、县城、建制镇，以及税法规定征收增值税、消费税的其他地区。", "chapter": "第四章 城市维护建设税"}, {"id": "c06", "tag": "考点03 · 征税范围 · 熟", "title": "进口不征、出口不退", "body": "进口不征：对进口货物或者境外单位和个人向境内销售服务、无形资产缴纳的增值税、消费税税额，不征收城市维护建设税。\n\n出口不退：对出口产品退还增值税、消费税的，不退还已缴纳的城市维护建设税。", "chapter": "第四章 城市维护建设税"}, {"id": "c07", "tag": "考点04 · 税率 · 熟", "title": "一般规定（三档税率）", "body": "地区差别比例税率，7%、5%、1% 三档：\n· 市区 —— 7%\n· 县城、镇 —— 5%\n· 不在市区、县城、镇 —— 1%\n\n纳税人所在地：指纳税人住所地或者与纳税人生产经营活动相关的其他地点，具体地点由省、自治区、直辖市确定。", "chapter": "第四章 城市维护建设税"}, {"id": "c08", "tag": "考点04 · 税率 · 熟", "title": "特殊规定", "body": "（1）市区、县城、镇按照行政区划确定。行政区划变更的，自变更完成当月起适用新行政区划对应的城市维护建设税税率；纳税人在变更完成当月的下一个纳税申报期按新税率申报缴纳。\n\n（2）纳税人跨地区提供建筑服务、销售和出租不动产的，在建筑服务发生地、不动产所在地预缴增值税时，按预缴地城市维护建设税税率就地计算缴纳城市维护建设税。\n\n（3）下列两种情况，可按纳税人缴纳“两税”所在地的规定税率就地缴纳城市维护建设税：①由受托方代收、代扣“两税”的单位和个人；②流动经营等无固定纳税地点的单位和个人。\n\n（4）委托加工业务中，如果受托方是个人的，不实行代收代缴，而是由委托方收回后自行缴纳消费税，所以城市维护建设税也是按委托方所在地税率计算缴纳。", "chapter": "第四章 城市维护建设税"}, {"id": "c09", "tag": "考点05 · 税收优惠 · 熟", "title": "特定减免税政策（一）", "body": "· 黄金相关（调整）：会员单位或客户通过上海黄金交易所、上海期货交易所交易标准黄金，卖出方销售标准黄金时免征城建税；未发生实物交割出库的，交易所免征城建税。\n\n· 基础设施：对国家重大水利工程建设基金免征城建税。\n\n· 创业就业：实施扶持自主就业退役士兵创业就业、重点群体创业就业城建税减免。", "chapter": "第四章 城市维护建设税"}, {"id": "c10", "tag": "考点05 · 税收优惠 · 熟", "title": "特定减免税政策（二）", "body": "· 金融机构撤销：经中国人民银行依法决定撤销的金融机构及其分设于各地的分支机构，用其财产清偿债务时，免征被撤销金融机构转让货物、不动产等应缴纳的城建税。\n\n· 小企业相关：自 2023 年 1 月 1 日至 2027 年 12 月 31 日，对增值税小规模纳税人、小型微利企业和个体工商户，减半征收城建税。\n\n· 文化事业单位转制：经营性文化事业单位转制为企业中资产评估增值、资产转让或划转涉及的城建税，符合现行规定的享受相应税收优惠政策，政策执行至 2027 年 12 月 31 日。", "chapter": "第四章 城市维护建设税"}, {"id": "c11", "tag": "考点05 · 税收优惠 · 熟", "title": "其他优惠政策（“两税”与城建税联动）", "body": "· “两税”减免 → 城建税随之减免\n· “两税”补罚 → 城建税随之补罚\n· “两税”的滞纳金和罚款 → 不作为城建税的计税依据\n· 由于“两税”减免而发生的退税 → 退还已纳的城建税\n· 对出口产品退还“两税”的 → 不退还已缴纳的城建税（出口不退）\n· 海关对进口环节代征的“两税”、境外单位和个人向境内销售服务/无形资产缴纳的增值税 → 不征收城建税（进口不征）\n· “两税”实行先征后返、先征后退、即征即退办法 → 除另有规定外，对随“两税”征收的城建税一律不予退（返）还", "chapter": "第四章 城市维护建设税"}, {"id": "c12", "tag": "考点06 · 计税依据 · 精", "title": "核心公式", "body": "城建税的计税依据是纳税人实际缴纳的消费税、增值税税额。\n\n实际缴纳的“两税”税额 ＝ 应当缴纳的“两税”税额（不含因进口货物或境外单位和个人向境内销售服务、无形资产缴纳的“两税”税额）＋增值税免抵税额－直接减免的“两税”税额－期末留抵退税退还的增值税税额\n\n注：直接减免的“两税”税额，是指依照增值税、消费税相关法律法规和税收政策规定，直接减征或免征的“两税”税额，不包括实行先征后返、先征后退、即征即退办法退还的“两税”税额。", "chapter": "第四章 城市维护建设税"}, {"id": "c13", "tag": "考点06 · 计税依据 · 精", "title": "要点提示", "body": "· 免抵税额要缴纳城市维护建设税。\n（被出口应退税额抵顶的内销应纳税额，实质是企业应缴的增值税，需作为城建税计税依据，不能因征管方式改变而减少计税依据。）\n\n· 城市维护建设税计税依据不包括加收的滞纳金和罚款。\n\n· 对于增值税小规模纳税人更正、查补此前按照一般计税方法确定的城建税计税依据，允许扣除尚未扣除完的留抵退税额。\n\n· 留抵退税额不能从简易计税方法计算的应纳增值税中扣减：①纳税人自收到留抵退税额之日起，应当在下一个纳税申报期从城建税计税依据中扣除；②留抵退税额仅允许在按照增值税一般计税方法确定的城建税计税依据中扣除，当期未扣除完的余额，在以后纳税申报期按规定继续扣除。", "chapter": "第四章 城市维护建设税"}, {"id": "c14", "tag": "考点06 · 计税依据 · 精", "title": "包含 / 不包含 一览", "body": "包括（计入城建税计税依据）：\n· 被查补的“两税”税额\n· 增值税免抵税额\n\n不包括（不计入）：\n· 进口环节被海关代征的“两税”税额\n· 境外单位和个人向境内销售服务、无形资产向税务机关缴纳的增值税税额\n· 直接减免的“两税”税额\n· 加收的滞纳金和罚款（非税款项）\n· 期末留抵退税退还的增值税\n· 除“两税”外的其他税", "chapter": "第四章 城市维护建设税"}, {"id": "c15", "tag": "考点07 · 应纳税额的计算 · 精", "title": "计算公式", "body": "应纳税额 ＝（实纳增值税税额 ＋ 实纳消费税税额）× 适用税率", "chapter": "第四章 城市维护建设税"}, {"id": "c16", "tag": "考点08 · 征收管理 · 识", "title": "征收管理规定", "body": "城市维护建设税的纳税义务发生时间、纳税地点、纳税期限，比照增值税、消费税的相应规定；其纳税义务发生时间与“两税”的纳税义务发生时间一致，分别与“两税”同时缴纳。\n\n1. 同时缴纳：是指在缴纳“两税”时，应当在“两税”同一缴纳地点、同一缴纳期限内，一并缴纳对应的城市维护建设税。\n\n2. 采用委托代征、代扣代缴、代收代缴、预缴、补缴等方式缴纳“两税”的，应当同时缴纳城市维护建设税。代扣代缴，不含因境外单位和个人向境内销售服务、无形资产代扣代缴增值税情形。", "chapter": "第四章 城市维护建设税"}];

function load(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
function st(id){ if(!state[id]) state[id] = { box:0, due: todayNum(), reps:0 }; return state[id]; }
CARDS.forEach(c=>st(c.id));

let currentChapter = "ALL";
let queue = [];
let cur = 0;

function scoped(){ return CARDS.filter(c => currentChapter==="ALL" || c.chapter===currentChapter); }
function buildQueue(){
  const t = todayNum();
  queue = scoped().filter(c => st(c.id).due <= t).map(c=>c.id);
  queue.sort((a,b)=> st(a).due - st(b).due);
  cur = 0;
}

function renderChips(){
  const el = document.getElementById("chaps");
  const defs = [{key:"ALL",short:"全部"}].concat(CHAPTERS);
  el.innerHTML = "";
  defs.forEach(d=>{
    const b = document.createElement("button");
    b.className = "chip" + (d.key===currentChapter?" active":"");
    b.textContent = d.short;
    b.onclick = ()=>{ currentChapter = d.key; renderChips(); buildQueue(); render(); };
    el.appendChild(b);
  });
}

function render(animDir){
  const id = queue[cur];
  const cardEl = document.getElementById("card");
  const doneEl = document.getElementById("done");
  const actions = document.getElementById("actions");
  const nav = document.getElementById("nav");
  const hint = document.getElementById("hint");

  if(!id){
    cardEl.style.display = "none";
    doneEl.classList.add("show");
    doneEl.innerHTML = renderDone();
    actions.style.display = "none";
    nav.style.display = "none";
    hint.style.display = "none";
    updateHeader();
    return;
  }
  cardEl.style.display = "flex";
  doneEl.classList.remove("show");
  actions.style.display = "grid";
  nav.style.display = "flex";
  hint.style.display = "block";

  const c = CARDS.find(x=>x.id===id);
  const s = st(id);
  document.getElementById("chap").textContent = c.chapter;
  document.getElementById("tag").textContent = c.tag;
  document.getElementById("title").textContent = c.title;
  document.getElementById("body").textContent = c.body;
  document.getElementById("meta").innerHTML =
    "<span>练习次数："+(s.reps||0)+" 次</span>" +
    "<span>下次复习："+labelForBox(s.box)+"</span>";
  document.getElementById("body").scrollTop = 0;
  document.getElementById("counter").textContent = (cur+1)+" / "+queue.length;
  document.getElementById("prev").disabled = (cur<=0);
  document.getElementById("next").disabled = (cur>=queue.length-1);

  if(animDir){
    cardEl.style.transition="none";
    cardEl.style.transform="translateX("+(animDir==="left"?46:-46)+"px)";
    cardEl.style.opacity="0";
    requestAnimationFrame(()=>{
      cardEl.style.transition="transform .24s ease, opacity .24s ease";
      cardEl.style.transform="translateX(0)"; cardEl.style.opacity="1";
    });
  }
  updateHeader();
}

function renderDone(){
  const t = todayNum();
  const list = scoped();
  const buckets = {};
  list.forEach(c=>{ const s=st(c.id); const dd=Math.max(0,Math.round((s.due-t)/DAY)); buckets[dd]=(buckets[dd]||0)+1; });
  const labels={0:"今天",1:"明天",2:"2 天后",4:"4 天后",7:"7 天后",15:"15 天后",30:"30 天后",60:"60 天后"};
  let sched = "<div class='sched'><b>后续复习排期</b><br>";
  Object.keys(buckets).sort((a,b)=>a-b).forEach(k=>{ sched += "· "+(labels[k]||(k+" 天后"))+"："+buckets[k]+" 张<br>"; });
  sched += "</div>";
  const scopeName = currentChapter==="ALL" ? "全部章节" : currentChapter;
  return "<div class='big'>🎉</div><h3>今日复习完成</h3>"+
    "<p>"+scopeName+" 共 "+list.length+" 张卡片，已按记忆效果排好下次复习时间。</p>"+sched+
    "<p style='margin-top:14px'>明天再来，到期的卡片会自动排给你。</p>";
}

function updateHeader(){
  const t = todayNum();
  const list = scoped();
  const dueCount = list.filter(c=>st(c.id).due<=t).length;
  const doneCount = list.length - dueCount;
  document.getElementById("sub").textContent = "今日待复习 "+dueCount+" 张 ｜ 已完成 "+doneCount+" / "+list.length;
  document.getElementById("barfill").style.width = (list.length? (doneCount/list.length*100):0)+"%";
}

function grade(id, g){
  const s = st(id);
  if(g==="again"){ s.box = 0; }
  else if(g==="hard"){ s.box = Math.max(0, s.box); }
  else { s.box = Math.min(6, s.box+1); }
  let iv;
  if(g==="again") iv = 0;
  else if(g==="hard") iv = Math.max(1, Math.round((INTERVALS[s.box]||1)*0.5));
  else iv = INTERVALS[s.box];
  s.due = todayNum() + iv*DAY;
  s.reps = (s.reps||0)+1;
  save();
}

function onGrade(g){
  const id = queue[cur];
  if(!id) return;
  grade(id, g);
  if(g==="again"){ queue.splice(cur,1); queue.push(id); if(cur>=queue.length) cur=0; }
  else { queue.splice(cur,1); if(cur>=queue.length) cur=0; }
  render("left");
}

function next(){ if(cur < queue.length-1){ cur++; render("left"); } }
function prev(){ if(cur > 0){ cur--; render("right"); } }

document.getElementById("actions").addEventListener("click", e=>{
  const b = e.target.closest("button[data-g]");
  if(b) onGrade(b.dataset.g);
});
document.getElementById("prev").addEventListener("click", prev);
document.getElementById("next").addEventListener("click", next);

document.getElementById("reset").addEventListener("click", ()=>{
  if(confirm("确定重置本机的复习进度吗？（所有卡片将回到待复习状态）")){
    state = {}; save(); CARDS.forEach(c=>st(c.id)); buildQueue(); render();
  }
});

(function(){
  const stage = document.getElementById("stage");
  let sx=null, sy=null;
  function start(x,y){ sx=x; sy=y; }
  function end(x,y){
    if(sx===null) return;
    const dx=x-sx, dy=y-sy; sx=null;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.2){ dx<0?next():prev(); }
  }
  stage.addEventListener("touchstart", e=>{ const t=e.changedTouches[0]; start(t.clientX,t.clientY); }, {passive:true});
  stage.addEventListener("touchend", e=>{ const t=e.changedTouches[0]; end(t.clientX,t.clientY); }, {passive:true});
  stage.addEventListener("touchcancel", ()=>{ sx=null; }, {passive:true});
  stage.addEventListener("pointerdown", e=>{ if(e.pointerType==="mouse") start(e.clientX,e.clientY); });
  stage.addEventListener("pointerup", e=>{ if(e.pointerType==="mouse") end(e.clientX,e.clientY); });
})();

renderChips();
buildQueue();
render();
</script>
</body>
</html>
